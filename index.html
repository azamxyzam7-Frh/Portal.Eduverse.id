<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eduverse.id — Portal Belajar</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f5fb;--card:#fff;--ink:#151a2c;--muted:#6b7390;--line:#e8eaf4;--soft:#ece9ff;--brand:#5b3df5;--grad:linear-gradient(135deg,#8a3ffc,#3b6cff);--btn:#151a2c;--sh:0 10px 34px rgba(60,64,140,.09);--r:22px}
body.dark{--bg:#0e1120;--card:#171b2e;--ink:#eef0fb;--muted:#9aa2c0;--line:#262b44;--soft:#2a2652;--brand:#a18bff;--btn:#fff;--sh:0 10px 34px rgba(0,0,0,.3)}
body.dark .btn{color:#151a2c}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:500 14px/1.55 'Plus Jakarta Sans',system-ui,sans-serif}
button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
svg{flex:none}
.side{position:fixed;inset:16px auto 16px 16px;width:248px;background:var(--card);border-radius:26px;box-shadow:var(--sh);padding:20px 14px;display:flex;flex-direction:column;z-index:30;transition:width .2s,transform .25s;overflow:hidden}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px 18px;font-weight:800;font-size:19px}
.brand b{flex:1;white-space:nowrap}
.ghost{border:0;background:none;color:var(--muted);padding:6px;border-radius:10px;display:grid;place-items:center}
.ghost:hover{background:var(--soft);color:var(--brand)}
.nav{display:flex;flex-direction:column;gap:3px;overflow-y:auto;flex:1}
.nav button{display:flex;align-items:center;gap:13px;border:0;background:none;padding:11px 13px;border-radius:14px;color:var(--muted);font-weight:600;text-align:left;white-space:nowrap}
.nav button:hover{background:var(--bg);color:var(--ink)}
.nav button.on{background:var(--soft);color:var(--brand)}
.nav i{margin-left:auto;font-style:normal;font-size:11px;font-weight:700;background:var(--card);color:var(--brand);border-radius:99px;padding:1px 8px;min-width:24px;text-align:center}
.up{margin-top:12px;border-radius:18px;padding:14px;background:linear-gradient(135deg,var(--soft),var(--card));position:relative;overflow:hidden;border:1px solid var(--line)}
.up b{display:block;font-size:13px}.up p{margin:2px 0 10px;font-size:12px;color:var(--muted);max-width:110px}
.up:after{content:"";position:absolute;right:-8px;bottom:-8px;width:54px;height:54px;border-radius:16px;background:var(--grad);opacity:.35;transform:rotate(18deg)}
body.mini .side{width:84px}body.mini .brand b,body.mini .nav span,body.mini .nav i,body.mini .up{display:none}body.mini .main{margin-left:116px}
body.mini .brand{justify-content:center;padding-left:0;padding-right:0;flex-direction:column}
.main{margin-left:280px;padding:20px 28px 40px;max-width:1380px;transition:margin .2s}
.top{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:20px;box-shadow:var(--sh);padding:10px 12px 10px 20px;margin-bottom:22px}
.top h1{font-size:17px;margin:0;flex:1;letter-spacing:-.3px}
.menu{display:none}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid transparent;background:var(--btn);color:#fff;border-radius:14px;padding:11px 18px;font-weight:700;font-size:13px}
.btn:hover{opacity:.9}.btn.line{background:none;border-color:var(--btn);color:var(--ink)}
.btn.sm{padding:7px 12px;font-size:12px;border-radius:11px}
.ibtn{width:40px;height:40px;border-radius:13px;border:0;background:var(--bg);display:grid;place-items:center;color:var(--ink)}
.av{width:40px;height:40px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;font-weight:800}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:22px}
h2{font-size:21px;letter-spacing:-.4px;margin:0 0 4px}h3{font-size:15px;margin:0}.mut{color:var(--muted);font-size:13px;margin:0}
.grid{display:grid;gap:16px}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:1.5fr 1fr}
.stat{display:flex;gap:14px;align-items:center}.stat strong{display:block;font-size:24px;line-height:1.1}
.ico{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;flex:none}
.c1{background:#ece9ff;color:#5b3df5}.c2{background:#e1efff;color:#2f6df0}.c3{background:#e0f7ea;color:#1c9a5b}.c4{background:#ffeaf3;color:#d6336c}.c5{background:#fff1dd;color:#d9822b}.c6{background:#e6f6fb;color:#188fb0}
body.dark .ico{filter:brightness(.9)}
.bento{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.tile{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;text-align:left;width:100%;transition:transform .15s,box-shadow .15s}
.tile:hover{transform:translateY(-2px);box-shadow:var(--sh)}
.tile small{display:block;color:var(--muted);font-weight:500}
.feat{background:linear-gradient(135deg,#1c1a4a,#4a2fd1 70%,#3b6cff);color:#fff;position:relative;overflow:hidden;min-height:200px;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-start}
.feat:before,.feat:after{content:"";position:absolute;border-radius:26px;background:linear-gradient(135deg,rgba(255,255,255,.45),rgba(255,255,255,.08));border:1px solid rgba(255,255,255,.3)}
.feat:before{width:110px;height:110px;right:-18px;top:-10px;transform:rotate(24deg)}.feat:after{width:80px;height:80px;right:60px;top:70px;transform:rotate(-14deg)}
.feat h2{position:relative}.feat p{color:#d8d4ff;margin:0 0 14px;position:relative}.feat .btn{background:#fff;color:#151a2c;position:relative}
.bar{height:8px;background:var(--bg);border-radius:9px;overflow:hidden;margin:12px 0 6px}.bar span{display:block;height:100%;background:var(--grad);border-radius:9px;transition:width .4s}
.act{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}.act:first-of-type{border-top:0}
.act div:nth-child(2){flex:1}.act small{color:var(--muted)}.act .ico{width:38px;height:38px;border-radius:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
input,textarea,select{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 14px;width:100%}
.row input{max-width:320px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:7px 14px;font-size:12px;font-weight:600;color:var(--muted)}
.chip.on{background:var(--soft);color:var(--brand);border-color:transparent}
.mat{display:flex;flex-direction:column;gap:10px;align-items:flex-start}.mat p{flex:1}
.tag{font-size:11px;font-weight:700;color:var(--brand);background:var(--soft);padding:3px 10px;border-radius:99px}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:10px;font-weight:600}
.opt:hover:not(:disabled){border-color:var(--brand);background:var(--soft)}
.opt.ok{border-color:#1c9a5b;background:#e0f7ea;color:#146c40}.opt.no{border-color:#d6336c;background:#ffeaf3;color:#a3204f}
.big{font-size:54px;font-weight:800;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
.keys button{border:0;border-radius:16px;padding:16px 0;font-size:17px;font-weight:700;background:var(--bg)}
.keys .o{background:var(--soft);color:var(--brand)}.keys .e{background:var(--grad);color:#fff}
.disp{background:var(--bg);border-radius:18px;padding:16px 18px;text-align:right;min-height:84px}.disp small{color:var(--muted);display:block;min-height:20px}.disp b{font-size:30px}
.item{display:flex;gap:14px;align-items:flex-start;padding:14px 0;border-top:1px solid var(--line)}.item:first-child{border-top:0}.item>div{flex:1}.item p{margin:4px 0 0;color:var(--muted);white-space:pre-wrap}
.time{font-weight:800;color:var(--brand);min-width:52px}
.sw{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:16px 0;border-top:1px solid var(--line)}
.tg{width:46px;height:26px;border-radius:99px;border:0;background:var(--line);position:relative;flex:none}.tg:after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}.tg.on{background:var(--brand)}.tg.on:after{transform:translateX(20px)}
.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,20px);background:var(--btn);color:var(--card);padding:12px 20px;border-radius:14px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:60}.toast.on{opacity:1;transform:translate(-50%,0)}
.pw{overflow-x:auto;padding-bottom:6px}
.pt{display:grid;grid-template-columns:repeat(18,minmax(38px,1fr));grid-template-rows:repeat(7,42px) 10px repeat(2,42px);gap:3px;min-width:760px}
.el{display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:8px;border:1px solid color-mix(in srgb,var(--c) 45%,transparent);background:color-mix(in srgb,var(--c) 15%,var(--card));padding:0;line-height:1.1;color:var(--ink)}
.el small{font-size:8px;color:var(--muted)}.el b{font-size:13px}
.el:hover{background:color-mix(in srgb,var(--c) 32%,var(--card))}
.el.sel{outline:2px solid var(--brand);outline-offset:1px;z-index:1}.el.dim{opacity:.22}
.ptm{border-radius:8px;display:grid;place-items:center;font-size:8px;color:var(--muted);border:1px dashed var(--line)}
.pd{display:flex;gap:16px;align-items:center;margin:16px 0}.pd .el{width:84px;height:84px;flex:none;border-radius:18px}.pd .el b{font-size:30px}.pd .el small{font-size:11px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px}
.bd{white-space:pre-wrap;max-width:64ch;line-height:1.8;margin:0 0 8px}
.demo{background:var(--bg);border-radius:18px;padding:18px;margin-top:14px;max-width:640px}
.sl{display:block;margin:0 0 14px;font-size:13px}.sl input{padding:0;border:0;background:none;accent-color:var(--brand);margin-top:8px}
.res{font-size:15px;margin:10px 0 2px}.demo h3{font-size:16px}
.pn{display:grid;grid-template-columns:repeat(3,64px);gap:6px;margin:12px 0}.pn>*{display:grid;place-items:center;height:44px;border-radius:12px;font-weight:700}.pn b{color:var(--muted)}.pn span{background:var(--card);border:1px solid var(--line)}
:root{--shim:rgba(255,255,255,.65)}body.dark{--shim:rgba(255,255,255,.07)}
.btn,.chip,.tile,.opt,.nav button,.keys button{position:relative;overflow:hidden}
.btn{transition:transform .15s,box-shadow .2s}.btn svg{transition:transform .2s}.btn:active{transform:scale(.96);box-shadow:none}
.chip{transition:background .2s,color .2s,transform .15s}.chip:active,.opt:active:not(:disabled),.tile:active{transform:scale(.96)}
.ibtn{transition:transform .15s,background .2s}.ibtn:active{transform:scale(.9)}
.nav button{transition:background .2s,color .2s,transform .15s}.nav button:active{transform:scale(.97)}.nav button svg{transition:transform .2s}
.keys button{transition:transform .12s,filter .2s}.keys button:active{transform:scale(.92)}
.ico{transition:transform .25s}
.grid.g3>.card{border:1px solid transparent;transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s,border-color .25s}
.feat,.feat:before{transition:transform .35s cubic-bezier(.2,.8,.2,1)}
@media(hover:hover){
.btn:hover{opacity:1;transform:translateY(-2px);box-shadow:0 8px 20px rgba(21,26,44,.25)}.btn:hover svg{transform:translateX(4px)}.btn:active:hover{transform:scale(.96)}
.chip:hover{color:var(--brand);transform:translateY(-1px)}
.ibtn:hover{background:var(--soft);transform:rotate(-6deg) scale(1.06)}
.nav button:hover svg{transform:scale(1.14)}
.grid.g3>.card:hover{transform:translateY(-4px);border-color:var(--soft);box-shadow:0 18px 40px color-mix(in srgb,var(--brand) 22%,transparent)}
.grid.g3>.card:hover .ico,.tile:hover .ico{transform:scale(1.1) rotate(-5deg)}
.feat:hover{transform:translateY(-3px)}.feat:hover:before{transform:rotate(36deg) scale(1.1)}}
.rip{position:absolute;border-radius:50%;background:currentColor;opacity:.22;transform:scale(0);animation:rip .55s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(1);opacity:0}}
.sk{position:relative;overflow:hidden;border-radius:8px;background:color-mix(in srgb,var(--ink) 8%,transparent)}
.sk:after{content:"";position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,var(--shim),transparent);animation:shim 1.3s infinite}
.sk.l{height:12px;margin-top:12px}.sk.ic{width:46px;height:46px;border-radius:14px}
@keyframes shim{to{transform:translateX(100%)}}
@keyframes up{from{opacity:0;transform:translateY(8px)}}
#view.in>*{animation:up .3s ease both}
@media(prefers-reduced-motion:reduce){*,*:after{animation:none!important;transition:none!important}}
.hb{display:inline-block;color:#d6336c;font-size:34px;animation:beat 1s infinite}@keyframes beat{50%{transform:scale(1.25)}}
.c7{background:#e4e8ff;color:#3446d1}
.c8{background:#dff5f2;color:#0f8f80}.c9{background:#e8ecf3;color:#475569}.c10{background:#f3e8ff;color:#7e22ce}
.scrim{display:none}
body.calm *,body.calm *:after{transition:none!important;animation:none!important}
@media(max-width:980px){.g3,.bento{grid-template-columns:1fr 1fr}.g2{grid-template-columns:1fr}}
@media(max-width:860px){.side{transform:translateX(-115%);width:260px!important}body.open .side{transform:none}body.open .scrim{display:block;position:fixed;inset:0;background:rgba(10,12,30,.4);z-index:25}
.main,body.mini .main{margin-left:0;padding:14px}.menu{display:grid}.top .btn{display:none}}
@media(max-width:560px){.g3,.bento{grid-template-columns:1fr}}
</style>
</head>
<body>
<aside class="side" id="side"><div class="brand"><svg width="34" height="34" viewBox="0 0 40 40"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8a3ffc"/><stop offset="1" stop-color="#3b6cff"/></linearGradient></defs><circle cx="14" cy="24" r="10" fill="#3b8bff"/><circle cx="26" cy="24" r="10" fill="#5b6bff" opacity=".9"/><circle cx="20" cy="14" r="10" fill="url(#lg)"/></svg><b>Eduverse.id</b><button class="ghost" data-a="mini" aria-label="Ciutkan menu" id="mb"></button></div><nav class="nav" id="nav"></nav><div class="up"><b>Belajar harian</b><p>Selesaikan 1 kuis hari ini.</p><button class="btn sm" data-g="quiz">Mulai</button></div></aside>
<div class="scrim" data-a="close"></div>
<main class="main"><header class="top"><button class="ibtn menu" data-a="open" aria-label="Buka menu" id="ob"></button><h1 id="ttl"></h1><button class="ibtn" data-a="theme" aria-label="Ganti tema" id="tb"></button><button class="btn" data-g="quiz" id="cta"></button><div class="av" id="av"></div></header><div id="view"></div></main>
<div class="toast" id="toast" role="status"></div>
<script>
const $=s=>document.querySelector(s),P={home:'<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',book:'<path d="M4 4.5A2.5 2.5 0 0 1 6.5 2H20v17H6.5A2.5 2.5 0 0 0 4 21.5zM4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>',quiz:'<circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 .9-1 1.7M12 17h.01"/>',bulb:'<path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.7.7 1 1.5 1 2.5h6c0-1 .3-1.8 1-2.5A6 6 0 0 0 12 3z"/>',calc:'<rect x="5" y="3" width="14" height="18" rx="3"/><path d="M8.5 7.5h7M9 12h.01M12 12h.01M15 12h.01M9 16h.01M12 16h.01M15 16h.01"/>',note:'<path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16z"/>',cal:'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/>',set:'<path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/>',bar:'<path d="M5 21V11M12 21V4M19 21v-7"/>',atom:'<circle cx="12" cy="12" r="1.5"/><ellipse cx="12" cy="12" rx="10" ry="4"/><ellipse cx="12" cy="12" rx="10" ry="4" transform="rotate(60 12 12)"/><ellipse cx="12" cy="12" rx="10" ry="4" transform="rotate(120 12 12)"/>',leaf:'<path d="M5 20c0-9 5-15 15-16 0 10-6 15-15 16zM5 20l7-7"/>',flask:'<path d="M9 3h6M10 3v6L4.5 19a1.5 1.5 0 0 0 1.3 2h12.4a1.5 1.5 0 0 0 1.3-2L14 9V3"/>',pen:'<path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16z"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5 19 19M5 19l1.5-1.5M17.5 6.5 19 5"/>',moon:'<path d="M20 14.5A8 8 0 1 1 9.5 4 6.5 6.5 0 0 0 20 14.5z"/>',arr:'<path d="M5 12h14M13 6l6 6-6 6"/>',x:'<path d="M6 6l12 12M18 6 6 18"/>',menu:'<path d="M4 7h16M4 12h16M4 17h16"/>',ch:'<path d="m11 17-5-5 5-5M18 17l-5-5 5-5"/>',chr:'<path d="m13 7 5 5-5 5M6 7l5 5-5 5"/>',star:'<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/>'};
const ic=(n,s=20)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[n]}</svg>`;
const SUB=[['Matematika','bar','c1'],['Fisika','atom','c2'],['Biologi','leaf','c3'],['Kimia','flask','c4'],['B. Indonesia','pen','c5'],['Sejarah','book','c6'],['Astronomi','moon','c7'],['Logika dan Filsafat','bulb','c8'],['Informatika','calc','c9'],['Neurosains','atom','c10']];
const MAT=[[0,'Persamaan linear satu variabel','Cari nilai variabel dengan menjaga kedua ruas tetap seimbang.','## Apa itu persamaan linear?\nPersamaan linear satu variabel adalah kalimat matematika dengan tanda sama dengan (=) dan satu variabel berpangkat satu, misalnya 2x + 4 = 12. Tujuannya mencari nilai x yang membuat kedua ruas bernilai sama.\n\n## Langkah menyelesaikan\nBayangkan sebuah timbangan: apa pun yang dilakukan pada ruas kiri harus dilakukan juga pada ruas kanan agar tetap seimbang.\n1. Pindahkan angka tanpa variabel ke ruas kanan (dikurangi atau ditambah).\n2. Bagi kedua ruas dengan koefisien x.\n\n## Contoh\n2x + 4 = 12 → 2x = 12 − 4 = 8 → x = 8 ÷ 2 = 4.\nCek jawaban: 2(4) + 4 = 12 ✓\n\n## Tips\nSelalu masukkan jawabanmu kembali ke persamaan untuk memeriksa hasilnya.'],[1,'Hukum Newton','Tiga hukum dasar yang menjelaskan gerak benda.','## Tiga hukum gerak\nHukum I (kelembaman): benda diam tetap diam, dan benda bergerak lurus beraturan tetap bergerak, selama resultan gayanya nol. Itu sebabnya tubuhmu terdorong ke depan saat bus mengerem mendadak.\nHukum II: F = m × a. Gaya yang sama membuat benda ringan berakselerasi lebih besar daripada benda berat.\nHukum III: jika benda A mendorong B, maka B mendorong A dengan gaya sama besar dan berlawanan arah (aksi-reaksi).\n\n## Contoh soal\nBalok 5 kg didorong gaya 20 N di lantai licin. Percepatannya a = F ÷ m = 20 ÷ 5 = 4 m/s².\n\n## Ingat\nSatuan gaya adalah newton (N), dengan 1 N = 1 kg·m/s². Gaya aksi dan reaksi bekerja pada benda yang berbeda, jadi tidak saling meniadakan.'],[2,'Fotosintesis','Cara tumbuhan mengubah cahaya menjadi energi.','## Pengertian\nFotosintesis adalah proses tumbuhan hijau membuat makanan sendiri memakai cahaya matahari. Prosesnya terjadi di kloroplas, terutama pada daun, yang mengandung klorofil (zat hijau daun).\n\n## Bahan dan hasil\nBahan: air (diserap akar), karbon dioksida (masuk lewat stomata), dan cahaya.\nHasil: glukosa (disimpan sebagai amilum) dan oksigen yang dilepas ke udara.\nPersamaan singkat: 6CO₂ + 6H₂O + cahaya → C₆H₁₂O₆ + 6O₂\n\n## Mengapa penting?\nOksigen yang kita hirup dan hampir semua rantai makanan bergantung pada fotosintesis. Tanpa tumbuhan, hewan dan manusia tidak mendapat makanan maupun oksigen.\n\n## Faktor yang memengaruhi\nIntensitas cahaya, kadar CO₂, suhu, dan ketersediaan air.'],[3,'Tabel periodik','Unsur disusun berdasarkan nomor atom.','## Apa itu tabel periodik?\nTabel periodik menyusun semua unsur kimia berdasarkan nomor atom (jumlah proton) yang naik dari kiri ke kanan. Unsur dengan sifat mirip ditempatkan di kolom yang sama.\n\n## Cara membacanya\nGolongan adalah kolom vertikal (1–18). Unsur segolongan punya elektron valensi yang sama, sehingga sifat kimianya mirip. Periode adalah baris horizontal (1–7) dan menunjukkan jumlah kulit elektron.\n\n## Kelompok penting\nLogam alkali (golongan 1) sangat reaktif. Halogen (golongan 17) mudah membentuk garam. Gas mulia (golongan 18) sangat stabil dan hampir tidak bereaksi.\n\n## Coba sendiri\nGunakan tabel interaktif di bawah. Ketuk Na (natrium) dan Cl (klorin), lalu bandingkan golongan dan elektron valensinya. Dari situ kamu bisa melihat mengapa keduanya membentuk NaCl.'],[4,'Kalimat efektif','Tulis singkat, jelas, dan tidak berbelit.','## Pengertian\nKalimat efektif adalah kalimat yang pesannya sampai ke pembaca dengan tepat, jelas, dan tidak bertele-tele.\n\n## Ciri-ciri\n• Memiliki subjek dan predikat yang jelas.\n• Hemat kata, tanpa pengulangan yang tidak perlu.\n• Memakai kata baku dan ejaan yang benar.\n• Bentuk katanya sejajar (paralel).\n\n## Contoh perbaikan\nKurang efektif: "Para siswa-siswa sedang belajar di dalam kelas itu."\nEfektif: "Para siswa sedang belajar di kelas."\nKata "para" sudah menunjukkan jamak, jadi "siswa-siswa" berlebihan.\n\n## Tips\nBaca kalimatmu dengan suara keras. Jika terasa panjang atau membingungkan, pangkas kata yang tidak mengubah makna.'],[5,'Proklamasi 1945','Peristiwa lahirnya negara Indonesia merdeka.','## Latar belakang\nPada Agustus 1945 Jepang terdesak dalam Perang Dunia II. Bom atom dijatuhkan di Hiroshima (6 Agustus) dan Nagasaki (9 Agustus), lalu Jepang menyerah kepada Sekutu pada 15 Agustus. Terjadi kekosongan kekuasaan di Indonesia. Golongan muda (antara lain Chaerul Saleh, Sukarni, dan Wikana) mendesak agar kemerdekaan segera diproklamasikan, sedangkan golongan tua ingin menempuh proses yang lebih teratur lewat PPKI.\n\n## Peristiwa Rengasdengklok\nPada 16 Agustus 1945 golongan muda membawa Soekarno dan Hatta ke Rengasdengklok, Karawang, agar menjauh dari pengaruh Jepang. Setelah Achmad Soebardjo menjamin proklamasi akan segera dilakukan, keduanya kembali ke Jakarta.\n\n## Perumusan dan pembacaan\nMalam 16–17 Agustus, naskah dirumuskan di rumah Laksamana Maeda oleh Soekarno, Hatta, dan Achmad Soebardjo, lalu diketik Sayuti Melik. Proklamasi dibacakan Soekarno pada 17 Agustus 1945 pukul 10.00 di Jalan Pegangsaan Timur 56, Jakarta. Bendera Merah Putih yang dijahit Fatmawati dikibarkan oleh Latief Hendraningrat dan Soehoed.\n\n## Sehari sesudahnya\nPada 18 Agustus 1945 PPKI mengesahkan UUD 1945 dan memilih Soekarno sebagai presiden serta Hatta sebagai wakil presiden.\n\n## Makna\nProklamasi menandai lahirnya negara Republik Indonesia yang merdeka dan berdaulat.'],[0,'Teorema Pythagoras','Hubungan sisi-sisi pada segitiga siku-siku.','## Bunyi teorema\nPada segitiga siku-siku, kuadrat sisi miring sama dengan jumlah kuadrat kedua sisi lainnya: a² + b² = c². Sisi miring (c) berhadapan dengan sudut siku-siku dan merupakan sisi terpanjang.\n\n## Mencari sisi miring\nSisi siku-siku 6 dan 8. c² = 36 + 64 = 100, sehingga c = 10.\n\n## Mencari sisi siku-siku\nSisi miring 13 dan satu sisi 5. b² = 13² − 5² = 169 − 25 = 144, sehingga b = 12.\n\n## Tripel Pythagoras\nTiga bilangan bulat yang memenuhi teorema, misalnya 3-4-5, 5-12-13, dan 8-15-17. Hafalkan agar mengerjakan soal lebih cepat.\n\n## Kegunaan\nMenghitung panjang tangga yang bersandar di dinding, jarak diagonal layar, atau tinggi tiang.'],[0,'Luas dan keliling bangun datar','Rumus dasar persegi panjang, segitiga, dan lingkaran.','## Beda luas dan keliling\nKeliling adalah panjang garis di sekeliling bangun (satuan cm, m). Luas adalah besar daerah di dalam bangun (satuan cm², m²).\n\n## Rumus penting\n• Persegi: L = s × s, K = 4s\n• Persegi panjang: L = p × l, K = 2(p + l)\n• Segitiga: L = ½ × alas × tinggi\n• Lingkaran: L = πr², K = 2πr (π ≈ 3,14 atau 22/7)\n\n## Contoh\nTaman persegi panjang berukuran 12 m × 5 m. Luas = 12 × 5 = 60 m². Keliling = 2(12 + 5) = 34 m.\n\n## Tips\nJari-jari (r) adalah setengah diameter. Pastikan semua sisi memakai satuan yang sama sebelum dihitung.'],[1,'Usaha dan energi','Usaha terjadi ketika gaya memindahkan benda.','## Usaha\nUsaha dilakukan ketika gaya membuat benda berpindah searah gaya: W = F × s, dengan satuan joule (J). Mendorong tembok tidak menghasilkan usaha karena tembok tidak berpindah.\n\n## Energi mekanik\nEnergi kinetik (gerak): Ek = ½mv². Energi potensial (ketinggian): Ep = mgh, dengan g ≈ 10 m/s².\n\n## Hukum kekekalan energi\nEnergi tidak dapat diciptakan atau dimusnahkan, hanya berubah bentuk. Bola yang jatuh mengubah energi potensial menjadi energi kinetik.\n\n## Contoh soal\nBenda 2 kg berada di ketinggian 5 m. Ep = 2 × 10 × 5 = 100 J. Saat hampir menyentuh tanah, energi kinetiknya mendekati 100 J.'],[1,'Listrik dinamis','Arus, tegangan, dan hambatan dalam rangkaian.','## Besaran dasar\nKuat arus (I, ampere) adalah aliran muatan. Tegangan (V, volt) adalah dorongan yang membuat muatan mengalir. Hambatan (R, ohm) adalah penghambat aliran.\n\n## Hukum Ohm\nV = I × R. Jika dua besaran diketahui, yang ketiga bisa dicari: I = V ÷ R dan R = V ÷ I.\n\n## Rangkaian seri dan paralel\nSeri: satu jalur, arus sama di mana-mana, hambatan dijumlahkan (R = R₁ + R₂). Jika satu lampu putus, semua padam.\nParalel: banyak cabang, tegangan sama di tiap cabang. Jika satu lampu putus, lampu lain tetap menyala. Instalasi rumah memakai rangkaian paralel.\n\n## Contoh\nBaterai 12 V dihubungkan ke hambatan 4 Ω. I = 12 ÷ 4 = 3 A.'],[2,'Sistem pencernaan','Perjalanan makanan dari mulut sampai usus besar.','## Fungsi\nSistem pencernaan memecah makanan menjadi zat sederhana yang dapat diserap tubuh, lalu membuang sisanya.\n\n## Perjalanan makanan\n1. Mulut: gigi mengunyah, air liur (amilase) mulai mencerna amilum.\n2. Kerongkongan: mendorong makanan dengan gerak peristaltik.\n3. Lambung: asam lambung dan enzim pepsin mencerna protein.\n4. Usus halus: pencernaan selesai, sari makanan diserap ke darah.\n5. Usus besar: menyerap air dan membentuk feses.\n\n## Organ pendukung\nHati menghasilkan empedu untuk mencerna lemak. Pankreas menghasilkan enzim pencernaan.\n\n## Ingat\nUsus halus punya vili (jonjot) yang memperluas permukaan penyerapan.'],[2,'Pewarisan sifat','Cara sifat orang tua diturunkan ke anak.','## Istilah dasar\nGen adalah penentu sifat yang terletak pada kromosom. Alel adalah pasangan gen untuk satu sifat. Alel dominan (huruf besar) menutupi alel resesif (huruf kecil). Genotipe adalah susunan alelnya (misalnya Aa), fenotipe adalah sifat yang tampak.\n\n## Contoh persilangan\nBunga merah (A) dominan terhadap putih (a). Persilangan Aa × Aa menghasilkan AA, Aa, Aa, dan aa. Rasio genotipe 1 : 2 : 1, rasio fenotipe 3 merah : 1 putih.\n\n## Tips\nGunakan diagram kotak (Punnett) untuk menyilangkan alel agar tidak ada kombinasi yang terlewat.'],[3,'Asam, basa, dan pH','Skala pH menunjukkan tingkat keasaman larutan.','## Pengertian\nAsam melepaskan ion H⁺ dalam air dan rasanya masam. Basa melepaskan ion OH⁻ dan terasa licin. Tingkat keasaman diukur dengan skala pH.\n\n## Skala pH\npH 0–6 asam, pH 7 netral, pH 8–14 basa. Semakin kecil pH, semakin asam. Selisih satu angka pH berarti selisih sepuluh kali lipat keasaman.\n\n## Contoh dalam kehidupan\nAsam: jeruk nipis, cuka, air aki. Basa: sabun, pasta gigi, obat maag. Netral: air murni.\n\n## Indikator\nLakmus biru menjadi merah pada asam. Lakmus merah menjadi biru pada basa. Indikator universal memberi warna berbeda untuk setiap nilai pH.\n\n## Ingat\nJangan mencicipi bahan kimia untuk menguji asam atau basa. Gunakan indikator.'],[3,'Ikatan kimia','Cara atom bergabung membentuk senyawa.','## Mengapa atom berikatan?\nAtom ingin memiliki susunan elektron yang stabil seperti gas mulia (aturan oktet: 8 elektron di kulit terluar).\n\n## Ikatan ion\nTerjadi antara logam dan nonlogam. Logam melepas elektron, nonlogam menerimanya. Na melepas 1 elektron menjadi Na⁺, Cl menerimanya menjadi Cl⁻, lalu keduanya tarik-menarik membentuk NaCl (garam dapur).\n\n## Ikatan kovalen\nTerjadi antara nonlogam dengan nonlogam melalui pemakaian elektron bersama. Pada H₂O, oksigen berbagi elektron dengan dua atom hidrogen.\n\n## Perbandingan\nSenyawa ion umumnya padat, bertitik lebur tinggi, dan menghantar listrik saat larut. Senyawa kovalen umumnya bertitik lebur rendah.'],[4,'Teks eksposisi','Teks yang menjelaskan gagasan disertai fakta.','## Pengertian\nTeks eksposisi menjelaskan suatu gagasan atau pendapat disertai fakta dan data supaya pembaca memahami atau yakin. Contohnya artikel tentang manfaat membaca atau bahaya sampah plastik.\n\n## Struktur teks\n1. Tesis: pernyataan pendapat atau pokok persoalan.\n2. Argumentasi: alasan, fakta, data, atau pendapat ahli yang mendukung.\n3. Penegasan ulang: kesimpulan yang menguatkan tesis.\n\n## Ciri kebahasaan\nMemakai kata penghubung (karena, oleh sebab itu, selain itu), istilah sesuai topik, dan kalimat yang informatif.\n\n## Contoh singkat\nTesis: membaca setiap hari melatih kemampuan berpikir. Argumentasi: siswa yang rutin membaca biasanya lebih cepat memahami soal. Penegasan: karena itu, biasakan membaca minimal 15 menit setiap hari.'],[4,'Ejaan dan tanda baca','Aturan huruf kapital, koma, dan titik.','## Huruf kapital\nDipakai pada awal kalimat, nama orang, nama tempat, nama bulan, dan nama hari. Contoh: Budi pergi ke Bandung pada hari Senin.\n\n## Tanda koma\nDipakai untuk memisahkan unsur dalam perincian (apel, jeruk, dan mangga), sebelum kata penghubung seperti tetapi dan melainkan, serta setelah kata seru di awal kalimat seperti wah atau ya.\n\n## Titik dan tanda tanya\nTitik mengakhiri kalimat berita dan tidak dipakai di akhir judul. Tanda tanya mengakhiri kalimat pertanyaan.\n\n## Kata baku\nGunakan bentuk baku: analisis, risiko, nasihat, apotek, kualitas.\n\n## Tips\nPeriksa tulisanmu dengan KBBI daring jika ragu menulis suatu kata.'],[5,'Kerajaan Hindu-Buddha','Kerajaan besar di Nusantara sebelum masa Islam.','## Masuknya pengaruh\nHubungan dagang Nusantara dan India sudah berlangsung sejak awal Masehi. Pedagang dan kaum brahmana membawa agama Hindu dan Buddha, bahasa Sanskerta, serta sistem pemerintahan kerajaan. Para penguasa lokal mengadopsinya untuk memperkuat kedudukan, sehingga lahir kerajaan-kerajaan bercorak Hindu-Buddha.\n\n## Kerajaan penting\n• Kutai (abad ke-4, Kalimantan Timur): kerajaan Hindu tertua, dikenal lewat prasasti Yupa dan Raja Mulawarman.\n• Tarumanegara (Jawa Barat): dipimpin Raja Purnawarman, meninggalkan prasasti Ciaruteun dan Tugu.\n• Sriwijaya (Sumatra): kerajaan maritim Buddha yang menguasai Selat Malaka dan menjadi pusat belajar agama Buddha.\n• Mataram Kuno (Jawa): membangun Borobudur (Buddha) dan Prambanan (Hindu).\n• Majapahit (Jawa Timur, 1293 hingga sekitar 1500): puncak kejayaan pada masa Hayam Wuruk dan Mahapatih Gajah Mada, yang bersumpah menyatukan Nusantara (Sumpah Palapa).\n\n## Kehidupan masyarakat\nMasyarakat bertani padi dan berdagang. Sastra berkembang, misalnya Negarakertagama karya Mpu Prapanca dan Sutasoma karya Mpu Tantular, yang memuat semboyan Bhinneka Tunggal Ika.\n\n## Sumber sejarah\nPrasasti, candi, dan kitab menjadi sumber utama untuk mempelajari masa ini.'],[5,'Masa penjajahan','Kedatangan bangsa Eropa dan perlawanan rakyat.','## Kedatangan bangsa Eropa\nBangsa Eropa datang mencari rempah-rempah yang sangat mahal di Eropa. Portugis menguasai Malaka (1511) dan tiba di Maluku pada awal abad ke-16, disusul Spanyol, Inggris, dan Belanda. Belanda tiba di Banten pada 1596.\n\n## VOC\nVOC dibentuk tahun 1602 dan diberi hak monopoli dagang. Dengan politik adu domba (devide et impera), VOC melemahkan kerajaan-kerajaan lokal. VOC bubar tahun 1799 karena korupsi dan utang.\n\n## Hindia Belanda\nWilayah VOC diambil alih pemerintah Belanda. Pada 1830 diberlakukan Tanam Paksa (cultuurstelsel): rakyat wajib menanam tanaman ekspor seperti kopi dan tebu. Sistem ini menguntungkan Belanda tetapi menyengsarakan rakyat.\n\n## Perlawanan rakyat\nPattimura di Maluku (1817), Perang Padri di Sumatra Barat (1803–1838), Perang Diponegoro di Jawa (1825–1830), dan Perang Aceh (1873–1904). Perlawanan berjalan sendiri-sendiri sehingga mudah dipatahkan.\n\n## Menuju kesadaran nasional\nPolitik Etis (1901) memperluas pendidikan bagi pribumi dan melahirkan kaum terpelajar yang kelak memimpin pergerakan nasional.'],[0,'Pecahan dan persen','Menghitung dan mengubah bentuk pecahan, desimal, dan persen.','## Pecahan\nPecahan ditulis a/b: a adalah pembilang, b adalah penyebut. Untuk menjumlahkan atau mengurangi, samakan dahulu penyebutnya. Contoh: 1/2 + 1/3 = 3/6 + 2/6 = 5/6. Untuk mengalikan, kalikan pembilang dengan pembilang dan penyebut dengan penyebut. Untuk membagi, kalikan dengan kebalikan pecahan kedua.\n\n## Pecahan, desimal, dan persen\n3/4 = 0,75 = 75%. Ubah pecahan ke desimal dengan membagi pembilang dengan penyebut, lalu kalikan 100 untuk mendapat persen.\n\n## Contoh\nDiskon 20% untuk barang seharga Rp150.000 berarti potongan 20/100 × 150.000 = Rp30.000, sehingga harga akhir Rp120.000.\n\n## Tips\nSederhanakan pecahan dengan membagi pembilang dan penyebut dengan faktor persekutuan terbesar (FPB).'],[0,'Statistika dasar','Mean, median, dan modus dari sekumpulan data.','## Tiga ukuran pemusatan\nMean (rata-rata) adalah jumlah semua data dibagi banyak data. Median adalah nilai tengah setelah data diurutkan. Modus adalah nilai yang paling sering muncul.\n\n## Contoh\nData: 6, 7, 7, 8, 9. Mean = (6 + 7 + 7 + 8 + 9) ÷ 5 = 37 ÷ 5 = 7,4. Median = 7 (data ke-3). Modus = 7.\n\n## Jika jumlah data genap\nMedian adalah rata-rata dua nilai tengah. Data 4, 6, 8, 10 → median = (6 + 8) ÷ 2 = 7.\n\n## Tips\nUrutkan data dari kecil ke besar sebelum mencari median. Mean mudah terpengaruh nilai ekstrem, sedangkan median lebih tahan terhadapnya.'],[1,'Gerak lurus','Kecepatan, percepatan, dan jarak tempuh benda.','## GLB\nGerak lurus beraturan (GLB): kecepatan tetap dan percepatan nol. Rumusnya s = v × t. Mobil berkecepatan 20 m/s selama 5 s menempuh 100 m.\n\n## GLBB\nGerak lurus berubah beraturan (GLBB): kecepatan berubah secara tetap karena ada percepatan. Rumusnya vt = v0 + a·t dan s = v0·t + ½·a·t².\n\n## Contoh\nSepeda motor mulai dari diam (v0 = 0) dengan percepatan 2 m/s². Setelah 5 s kecepatannya 10 m/s dan jarak tempuhnya ½ × 2 × 5² = 25 m.\n\n## Ingat\nKecepatan = jarak ÷ waktu. Untuk mengubah km/jam ke m/s, bagi dengan 3,6. Jadi 36 km/jam = 10 m/s.'],[1,'Cahaya dan pemantulan','Cara cahaya memantul pada cermin datar.','## Sifat cahaya\nCahaya merambat lurus, dapat dipantulkan, dibiaskan, dan diuraikan. Cahaya tidak memerlukan medium dan merambat sekitar 300.000 km/s di ruang hampa.\n\n## Hukum pemantulan\n1. Sinar datang, sinar pantul, dan garis normal berada pada satu bidang.\n2. Sudut datang (i) sama dengan sudut pantul (r).\nSudut diukur dari garis normal, bukan dari permukaan cermin.\n\n## Bayangan pada cermin datar\nBayangan bersifat maya, sama besar, tegak, dan jaraknya sama dengan jarak benda ke cermin. Sisi kiri dan kanan tampak tertukar.\n\n## Contoh\nJika sinar datang membentuk sudut 40° terhadap garis normal, sudut pantulnya juga 40°.'],[2,'Sistem peredaran darah','Jantung, pembuluh, dan komponen darah.','## Fungsi\nMengangkut oksigen, sari makanan, hormon, dan sisa metabolisme ke seluruh tubuh, serta membantu pertahanan tubuh.\n\n## Komponen darah\nSel darah merah (eritrosit) mengangkut oksigen dengan hemoglobin. Sel darah putih (leukosit) melawan kuman. Keping darah (trombosit) membantu pembekuan. Plasma adalah cairan tempat semuanya terbawa.\n\n## Jantung dan pembuluh\nJantung memiliki 4 ruang: 2 serambi dan 2 bilik. Arteri membawa darah keluar dari jantung, vena membawa darah kembali ke jantung, dan kapiler adalah tempat pertukaran zat.\n\n## Dua jalur peredaran\nPeredaran darah kecil: jantung → paru-paru → jantung (mengambil oksigen). Peredaran darah besar: jantung → seluruh tubuh → jantung.'],[2,'Rantai makanan dan ekosistem','Aliran energi antarmakhluk hidup.','## Komponen ekosistem\nProdusen (tumbuhan) membuat makanan sendiri. Konsumen memakan organisme lain: herbivora (konsumen I) dan karnivora (konsumen II dan III). Pengurai (jamur dan bakteri) menguraikan sisa makhluk hidup menjadi zat hara.\n\n## Rantai dan jaring-jaring makanan\nRantai makanan contohnya padi → tikus → ular → elang. Beberapa rantai yang saling berhubungan membentuk jaring-jaring makanan.\n\n## Aliran energi\nHanya sekitar 10% energi diteruskan ke tingkat berikutnya. Sisanya hilang sebagai panas dan dipakai untuk hidup. Karena itu jumlah organisme makin sedikit pada tingkat yang lebih tinggi.\n\n## Contoh\nJika padi menyimpan 10.000 kJ, tikus memperoleh sekitar 1.000 kJ, ular 100 kJ, dan elang 10 kJ.'],[3,'Struktur atom','Proton, neutron, elektron, dan konfigurasinya.','## Partikel penyusun atom\nAtom terdiri dari inti dan elektron. Inti berisi proton (bermuatan positif) dan neutron (tidak bermuatan). Elektron (bermuatan negatif) bergerak mengelilingi inti pada kulit-kulit.\n\n## Nomor atom dan nomor massa\nNomor atom = jumlah proton. Nomor massa = proton + neutron. Atom netral memiliki jumlah elektron yang sama dengan proton.\n\n## Konfigurasi elektron\nKulit diisi dari dalam: kulit K maksimal 2, kulit L maksimal 8, kulit M maksimal 8 (untuk 20 unsur pertama). Natrium (Z = 11) berkonfigurasi 2, 8, 1.\n\n## Isotop\nIsotop adalah atom unsur yang sama dengan jumlah neutron berbeda, misalnya karbon-12 dan karbon-14.'],[3,'Reaksi kimia dan persamaan reaksi','Menyetarakan reaksi dengan koefisien yang tepat.','## Ciri reaksi kimia\nTerbentuk zat baru, dengan tanda seperti perubahan warna, timbul gas, terbentuk endapan, atau perubahan suhu. Contohnya besi berkarat dan kayu terbakar.\n\n## Persamaan reaksi\nPereaksi (reaktan) ditulis di kiri dan hasil reaksi (produk) di kanan: 2H₂ + O₂ → 2H₂O. Angka di depan rumus disebut koefisien.\n\n## Hukum kekekalan massa\nMassa zat sebelum dan sesudah reaksi sama (Lavoisier). Karena itu jumlah tiap atom di kiri dan kanan harus sama.\n\n## Menyetarakan\nHitung atom tiap unsur, lalu ubah koefisien (bukan angka kecil di bawah rumus) sampai jumlah atom di kedua ruas sama.'],[4,'Unsur intrinsik cerita','Tema, tokoh, alur, latar, dan amanat.','## Apa itu unsur intrinsik?\nUnsur yang membangun cerita dari dalam karya itu sendiri. Berbeda dengan unsur ekstrinsik, yaitu hal di luar karya seperti latar belakang pengarang.\n\n## Unsur-unsurnya\n• Tema: gagasan pokok cerita.\n• Tokoh dan penokohan: pelaku dan wataknya.\n• Alur: urutan peristiwa (pengenalan, konflik, klimaks, penyelesaian).\n• Latar: tempat, waktu, dan suasana.\n• Sudut pandang: posisi pencerita (orang pertama "aku" atau orang ketiga "dia").\n• Amanat: pesan moral untuk pembaca.\n\n## Cara menemukannya\nTema ditemukan dari masalah yang paling sering muncul. Amanat ditemukan dari akibat perbuatan tokoh. Watak tokoh dinilai dari perkataan dan tindakannya.'],[4,'Majas dan gaya bahasa','Metafora, simile, personifikasi, dan lainnya.','## Pengertian\nMajas adalah gaya bahasa bermakna kiasan yang membuat tulisan lebih hidup.\n\n## Majas yang sering muncul\n• Metafora: perbandingan langsung tanpa kata pembanding. Contoh: Ayah adalah matahari keluarga.\n• Simile: perbandingan dengan kata seperti, bagai, atau laksana. Contoh: Suaranya merdu bagai buluh perindu.\n• Personifikasi: benda diberi sifat manusia. Contoh: Angin berbisik di telingaku.\n• Hiperbola: melebih-lebihkan. Contoh: Tasku beratnya sejuta ton.\n• Ironi: sindiran dengan makna berlawanan. Contoh: Wah, rajin sekali kamu, baru bangun jam sepuluh pagi.\n\n## Tips\nPerhatikan apakah ada kata pembanding. Jika ada, kemungkinan simile. Jika tidak ada, kemungkinan metafora.'],[5,'Kerajaan Islam di Nusantara','Dari Samudera Pasai sampai Mataram Islam.','## Masuknya Islam\nIslam masuk ke Nusantara lewat jalur perdagangan yang dibawa pedagang dari Gujarat, Arab, dan Persia. Penyebarannya berlangsung damai melalui perdagangan, pernikahan, dakwah, pendidikan, dan seni. Pelabuhan di pesisir menjadi pusat penyebaran agama.\n\n## Kerajaan di Sumatra\n• Samudera Pasai (Aceh, abad ke-13): kerajaan Islam pertama di Indonesia.\n• Aceh Darussalam: mencapai puncak pada masa Sultan Iskandar Muda dan menguasai perdagangan di Selat Malaka.\n\n## Kerajaan di Jawa\n• Demak: didirikan Raden Patah, kerajaan Islam pertama di Jawa.\n• Mataram Islam: puncak kejayaan pada masa Sultan Agung, yang menyerang VOC di Batavia pada 1628 dan 1629.\n• Banten dan Cirebon: pelabuhan penting di pesisir utara Jawa.\n\n## Sulawesi dan Maluku\nGowa-Tallo (Makassar) menjadi pusat dagang di bawah Sultan Hasanuddin, yang melawan VOC. Ternate dan Tidore di Maluku adalah penghasil cengkih.\n\n## Peran Walisongo dan peninggalan\nSembilan wali menyebarkan Islam di Jawa dengan cara damai, misalnya lewat wayang, gamelan, dan tembang. Peninggalannya antara lain Masjid Agung Demak, makam, naskah, dan seni kaligrafi.'],[5,'Pendudukan Jepang','Masa 1942–1945 dan jalan menuju kemerdekaan.','## Awal pendudukan\nBelanda menyerah kepada Jepang di Kalijati, Subang, pada 8 Maret 1942. Jepang awalnya disambut sebagai pembebas lewat propaganda "Jepang pemimpin, pelindung, dan cahaya Asia", tetapi segera memeras sumber daya Indonesia untuk kebutuhan perang.\n\n## Kebijakan Jepang\n• Organisasi politik dibubarkan, bahasa Belanda dilarang, dan bahasa Indonesia dipakai secara luas.\n• Dibentuk organisasi massa: Gerakan 3A, Putera (1943), dan Jawa Hokokai (1944).\n• Dibentuk organisasi militer: Heiho, Seinendan, Keibodan, dan PETA (1943).\n\n## Penderitaan rakyat\nRakyat dipaksa bekerja sebagai romusha, menyerahkan hasil bumi, dan mengalami kelaparan serta kekurangan pakaian. Banyak romusha dikirim jauh dan tidak kembali.\n\n## Perlawanan\nTerjadi perlawanan di Singaparna, Tasikmalaya (1944), dan pemberontakan PETA di Blitar (1945) yang dipimpin Supriyadi.\n\n## Menuju kemerdekaan\nSaat Jepang terdesak, dibentuk BPUPKI dan PPKI pada 1945. Pada 1 Juni 1945 Soekarno menyampaikan gagasan Pancasila dalam sidang BPUPKI.'],[0,'Perbandingan dan skala','Perbandingan senilai, berbalik nilai, dan skala peta.','## Perbandingan\nPerbandingan membandingkan dua besaran sejenis, ditulis a : b. Pada perbandingan senilai, jika satu naik maka yang lain ikut naik. Pada perbandingan berbalik nilai, jika satu naik maka yang lain turun.\n\n## Contoh senilai\n5 buku harganya Rp40.000. Harga 8 buku = 8/5 × 40.000 = Rp64.000.\n\n## Skala\nSkala = jarak pada peta ÷ jarak sebenarnya. Skala 1 : 500.000 berarti 1 cm pada peta mewakili 500.000 cm, yaitu 5 km.\n\n## Contoh skala\nDua kota berjarak 6 cm pada peta berskala 1 : 500.000. Jarak sebenarnya = 6 × 5 km = 30 km.\n\n## Tips\nSamakan satuan sebelum menghitung.'],[0,'Peluang','Seberapa mungkin suatu kejadian terjadi.','## Pengertian\nPeluang menyatakan seberapa mungkin suatu kejadian terjadi. Nilainya antara 0 (mustahil) dan 1 (pasti).\n\n## Rumus\nP(A) = banyak hasil yang diinginkan ÷ banyak semua hasil yang mungkin (ruang sampel).\n\n## Contoh\nSatu dadu dilempar. Peluang muncul angka genap (2, 4, 6) = 3 ÷ 6 = 1/2.\nDua koin dilempar menghasilkan 4 kemungkinan: AA, AG, GA, GG (A = angka, G = gambar). Peluang muncul dua angka = 1/4.\n\n## Ingat\nJumlah peluang semua hasil yang mungkin sama dengan 1. Peluang kejadian tidak terjadi = 1 − P(A).'],[1,'Suhu dan kalor','Menghitung energi panas yang berpindah.','## Suhu dan kalor\nSuhu menyatakan derajat panas suatu benda (satuan °C atau K). Kalor adalah energi panas yang berpindah karena perbedaan suhu (satuan joule).\n\n## Rumus kalor\nQ = m × c × ΔT, dengan m massa (kg), c kalor jenis (J/kg·°C), dan ΔT perubahan suhu. Kalor jenis air sekitar 4.200 J/kg·°C.\n\n## Contoh\nMemanaskan 2 kg air dari 20 °C ke 70 °C membutuhkan Q = 2 × 4.200 × 50 = 420.000 J.\n\n## Perpindahan kalor\nKonduksi (lewat zat padat), konveksi (lewat aliran zat cair atau gas), dan radiasi (lewat pancaran tanpa medium, seperti panas Matahari).'],[1,'Getaran dan gelombang','Frekuensi, periode, dan cepat rambat gelombang.','## Getaran\nGetaran adalah gerak bolak-balik melalui titik seimbang. Periode (T) adalah waktu satu getaran, frekuensi (f) adalah banyak getaran per detik (hertz). T = 1 ÷ f.\n\n## Gelombang\nGelombang merambatkan energi tanpa memindahkan zat. Gelombang transversal bergetar tegak lurus arah rambat (misalnya cahaya), sedangkan gelombang longitudinal bergetar sejajar arah rambat (misalnya bunyi).\n\n## Cepat rambat\nv = λ × f, dengan λ panjang gelombang (m) dan f frekuensi (Hz).\n\n## Contoh\nGelombang dengan f = 5 Hz dan λ = 2 m memiliki cepat rambat v = 10 m/s dan periode T = 0,2 s.'],[2,'Sistem pernapasan','Jalur udara dan pertukaran gas di paru-paru.','## Jalur udara\nUdara masuk melalui hidung → faring → laring → trakea → bronkus → bronkiolus → alveolus. Di alveolus terjadi pertukaran gas: oksigen masuk ke darah dan karbon dioksida keluar.\n\n## Mekanisme bernapas\nInspirasi: diafragma dan otot antartulang rusuk berkontraksi, rongga dada membesar, udara masuk. Ekspirasi: otot relaksasi, rongga dada mengecil, udara keluar.\n\n## Ingat\nHidung menyaring, menghangatkan, dan melembapkan udara. Paru-paru memiliki jutaan alveolus yang memperluas permukaan pertukaran gas.\n\n## Hal yang mengganggu\nAsap rokok dan polusi udara merusak silia dan alveolus serta meningkatkan risiko penyakit paru.'],[2,'Klasifikasi makhluk hidup','Mengelompokkan makhluk hidup dari kingdom sampai spesies.','## Mengapa diklasifikasikan?\nPengelompokan memudahkan kita mempelajari jutaan jenis makhluk hidup berdasarkan kesamaan ciri.\n\n## Tingkatan takson\nDari yang terluas ke yang paling sempit: Kingdom → Filum/Divisi → Kelas → Ordo → Famili → Genus → Spesies.\n\n## Nama ilmiah\nMemakai sistem binomial dari Carolus Linnaeus: genus + spesies, ditulis miring. Contoh: Homo sapiens (manusia).\n\n## Lima kingdom\nDalam sistem lima kingdom, makhluk hidup dibagi menjadi Monera, Protista, Fungi (jamur), Plantae (tumbuhan), dan Animalia (hewan).'],[3,'Konsep mol','Satuan jumlah partikel dalam kimia.','## Apa itu mol?\nMol adalah satuan jumlah partikel. Satu mol zat mengandung 6,02 × 10²³ partikel (bilangan Avogadro), seperti satu lusin selalu berisi 12.\n\n## Massa molar\nMassa 1 mol zat (dalam gram) sama dengan Mr-nya. Mr H₂O = 2(1) + 16 = 18, sehingga 1 mol air bermassa 18 g.\n\n## Rumus\nn = massa ÷ Mr. Jumlah partikel = n × 6,02 × 10²³.\n\n## Contoh\n9 g air = 9 ÷ 18 = 0,5 mol, yang mengandung 3,01 × 10²³ molekul.'],[3,'Larutan dan konsentrasi','Menghitung molaritas larutan.','## Larutan\nLarutan adalah campuran homogen dari zat terlarut (solut) dan pelarut (solven). Contohnya garam (terlarut) dalam air (pelarut).\n\n## Molaritas\nM = n ÷ V, dengan n dalam mol dan V dalam liter. Satuannya mol/L atau M.\n\n## Contoh\n5,85 g NaCl (Mr 58,5) = 0,1 mol. Jika dilarutkan hingga volume 0,5 L, molaritasnya = 0,1 ÷ 0,5 = 0,2 M.\n\n## Pengenceran\nM₁ × V₁ = M₂ × V₂. Menambah pelarut menurunkan konsentrasi, tetapi tidak mengubah jumlah mol zat terlarut.'],[4,'Teks prosedur','Menulis langkah-langkah yang berurutan.','## Pengertian\nTeks prosedur berisi langkah-langkah berurutan untuk melakukan atau membuat sesuatu, misalnya resep masakan atau cara memakai alat.\n\n## Struktur\n1. Tujuan: apa yang ingin dicapai.\n2. Bahan atau alat: yang perlu disiapkan.\n3. Langkah-langkah: urutan kegiatan.\n4. Penutup (opsional): hasil atau peringatan.\n\n## Ciri kebahasaan\nMemakai kalimat perintah (campurkan, panaskan, tekan) dan kata urutan (pertama, kemudian, selanjutnya, terakhir). Kalimatnya singkat dan jelas.\n\n## Contoh\nCara membuat teh: (1) Panaskan air hingga mendidih. (2) Tuang air ke cangkir berisi kantong teh. (3) Tunggu tiga menit. (4) Angkat kantong teh, lalu tambahkan gula secukupnya.'],[4,'Surat resmi','Bagian dan bahasa surat untuk keperluan formal.','## Pengertian\nSurat resmi adalah surat untuk keperluan dinas, organisasi, atau urusan formal, yang memakai bahasa baku dan sopan.\n\n## Bagian-bagian\n• Kop surat (untuk instansi)\n• Tanggal, nomor, lampiran, dan hal\n• Alamat tujuan\n• Salam pembuka\n• Isi: pembuka, inti, dan penutup\n• Salam penutup, tanda tangan, dan nama terang\n\n## Contoh kalimat\nPembuka: Dengan hormat, bersama surat ini kami mengundang Bapak/Ibu untuk hadir pada acara kami.\nPenutup: Atas perhatian dan kerja sama Bapak/Ibu, kami ucapkan terima kasih.\n\n## Tips\nGunakan bahasa baku, hindari singkatan tidak resmi, dan periksa ejaan nama serta jabatan.'],[5,'Pergerakan nasional','Organisasi pertama hingga Sumpah Pemuda.','## Latar belakang\nPolitik Etis (1901) memperluas pendidikan bagi pribumi. Lahirlah kaum terpelajar yang sadar akan ketidakadilan penjajahan dan memilih berjuang lewat organisasi modern, bukan lagi perlawanan senjata yang bersifat kedaerahan. Kemenangan Jepang atas Rusia (1905) juga menumbuhkan keyakinan bahwa bangsa Asia mampu mengalahkan bangsa Eropa.\n\n## Organisasi awal\n• Budi Utomo (20 Mei 1908): organisasi modern pertama di bidang pendidikan dan budaya. Tanggal berdirinya diperingati sebagai Hari Kebangkitan Nasional.\n• Sarekat Islam (1912): berawal dari Sarekat Dagang Islam, dipimpin H.O.S. Tjokroaminoto.\n• Indische Partij (1912): partai pertama yang menuntut kemerdekaan, dipimpin Tiga Serangkai (Douwes Dekker, Tjipto Mangunkusumo, Ki Hajar Dewantara).\n• Muhammadiyah (1912) dan Nahdlatul Ulama (1926): organisasi keagamaan dan sosial.\n\n## Gerakan lanjutan\nTaman Siswa (1922) didirikan Ki Hajar Dewantara. Perhimpunan Indonesia (1925) di Belanda menegaskan nama Indonesia. PNI didirikan Soekarno pada 1927.\n\n## Sumpah Pemuda\nKongres Pemuda II (27–28 Oktober 1928) mengikrarkan satu tanah air, satu bangsa, dan satu bahasa persatuan. Lagu Indonesia Raya pertama kali diperdengarkan di sana.'],[5,'Mempertahankan kemerdekaan','Perjuangan fisik dan diplomasi 1945–1949.','## Setelah proklamasi\nPasukan Sekutu datang untuk melucuti tentara Jepang, tetapi membawa serta NICA (Belanda) yang ingin kembali berkuasa. Hal ini memicu perlawanan rakyat di banyak daerah. Perjuangan dilakukan dengan dua cara: perang (fisik) dan perundingan (diplomasi).\n\n## Perjuangan fisik\n• Pertempuran Surabaya (10 November 1945): rakyat dan pemuda melawan pasukan Inggris. Tanggal ini diperingati sebagai Hari Pahlawan.\n• Pertempuran Ambarawa (Desember 1945).\n• Bandung Lautan Api (24 Maret 1946): warga membakar kota sebelum meninggalkannya.\n• Serangan Umum 1 Maret 1949: Yogyakarta dikuasai selama enam jam untuk menunjukkan bahwa Indonesia masih ada.\n\n## Perjuangan diplomasi\n• Linggarjati (1946): Belanda mengakui Jawa, Madura, dan Sumatra sebagai wilayah Indonesia (de facto).\n• Renville (1948): wilayah Indonesia menyempit.\n• Roem-Roijen (1949): Belanda setuju menarik pasukan dari Yogyakarta.\n• Konferensi Meja Bundar (1949): disepakati penyerahan kedaulatan.\n\n## Agresi militer Belanda\nAgresi Militer I (Juli 1947) dan II (Desember 1948). Saat Soekarno dan Hatta ditawan, Sjafruddin Prawiranegara membentuk pemerintahan darurat (PDRI) di Sumatra Barat.\n\n## Hasil\nBelanda mengakui kedaulatan Indonesia pada 27 Desember 1949. Republik Indonesia Serikat kemudian kembali menjadi negara kesatuan pada 17 Agustus 1950.'],[0,'Bangun ruang','Volume dan luas permukaan kubus, balok, dan tabung.','## Bangun ruang dasar\nKubus (semua rusuk sama panjang s), balok (p × l × t), dan tabung (jari-jari r dan tinggi t).\n\n## Rumus volume\nKubus: V = s³. Balok: V = p × l × t. Tabung: V = πr²t.\n\n## Luas permukaan\nKubus: L = 6s². Balok: L = 2(pl + pt + lt). Tabung: L = 2πr(r + t).\n\n## Contoh\nBalok 5 cm × 4 cm × 3 cm: V = 5 × 4 × 3 = 60 cm³ dan L = 2(20 + 15 + 12) = 94 cm².\n\n## Tips\nVolume memakai satuan pangkat tiga (cm³), sedangkan luas permukaan memakai pangkat dua (cm²).'],[0,'Barisan aritmetika','Pola bilangan dengan beda tetap.','## Pengertian\nBarisan aritmetika adalah barisan bilangan yang selisih tiap dua suku berurutan tetap, disebut beda (b). Contoh: 3, 7, 11, 15, … dengan b = 4.\n\n## Suku ke-n\nUn = a + (n − 1) × b, dengan a suku pertama.\n\n## Jumlah n suku pertama\nSn = n/2 × (a + Un) atau Sn = n/2 × (2a + (n − 1) × b).\n\n## Contoh\nBarisan 3, 7, 11, … U10 = 3 + 9 × 4 = 39. S10 = 10/2 × (3 + 39) = 210.'],[1,'Tekanan','Tekanan pada zat padat dan zat cair.','## Tekanan pada zat padat\nTekanan adalah gaya per satuan luas: P = F ÷ A, dengan satuan pascal (Pa = N/m²). Gaya yang sama pada bidang yang lebih sempit menghasilkan tekanan lebih besar. Itu sebabnya pisau tajam lebih mudah memotong.\n\n## Tekanan hidrostatis\nTekanan oleh zat cair: P = ρ × g × h, dengan ρ massa jenis (air 1.000 kg/m³), g = 10 m/s², dan h kedalaman. Semakin dalam, semakin besar tekanannya.\n\n## Contoh\nPada kedalaman 5 m di dalam air: P = 1.000 × 10 × 5 = 50.000 Pa.\n\n## Hukum Pascal\nTekanan pada zat cair di ruang tertutup diteruskan sama besar ke segala arah. Prinsip ini dipakai pada dongkrak hidrolik.'],[1,'Bunyi','Frekuensi, cepat rambat, dan gema.','## Sifat bunyi\nBunyi dihasilkan getaran dan merambat sebagai gelombang longitudinal. Bunyi memerlukan medium (padat, cair, atau gas) dan tidak merambat di ruang hampa. Di udara, kecepatannya sekitar 340 m/s.\n\n## Frekuensi\nInfrasonik: di bawah 20 Hz. Audiosonik (terdengar manusia): 20–20.000 Hz. Ultrasonik: di atas 20.000 Hz.\n\n## Pemantulan bunyi\nBunyi yang memantul pada dinding jauh terdengar sebagai gema. Jarak ke dinding d = v × t ÷ 2.\n\n## Contoh\nGema terdengar 1 detik setelah teriakan: d = 340 × 1 ÷ 2 = 170 m.'],[2,'Sistem ekskresi','Organ yang membuang zat sisa metabolisme.','## Pengertian\nEkskresi adalah pengeluaran zat sisa metabolisme dari tubuh. Ini berbeda dengan defekasi, yaitu pembuangan sisa makanan yang tidak tercerna.\n\n## Organ ekskresi\nGinjal membuang urea, kelebihan garam, dan air dalam bentuk urine. Kulit mengeluarkan keringat. Paru-paru melepas karbon dioksida dan uap air. Hati menghasilkan empedu dan mengubah amonia menjadi urea.\n\n## Ingat\nSetiap ginjal tersusun atas jutaan nefron yang menyaring darah. Minum air yang cukup membantu ginjal bekerja dengan baik.'],[2,'Sel dan jaringan','Unit terkecil kehidupan dan tingkat organisasinya.','## Sel\nSel adalah unit terkecil penyusun makhluk hidup. Bagian utamanya adalah membran sel, sitoplasma, dan inti sel (nukleus) yang mengendalikan kegiatan sel.\n\n## Organel penting\nMitokondria menghasilkan energi. Ribosom membuat protein. Vakuola menyimpan zat. Kloroplas, yang hanya ada pada tumbuhan, adalah tempat fotosintesis.\n\n## Sel hewan dan sel tumbuhan\nSel tumbuhan memiliki dinding sel, kloroplas, dan vakuola besar. Sel hewan tidak memiliki ketiganya.\n\n## Tingkat organisasi\nSel sejenis membentuk jaringan (misalnya jaringan otot), jaringan membentuk organ, lalu organ membentuk sistem organ.'],[3,'Wujud zat dan perubahannya','Padat, cair, gas, dan cara zat berubah wujud.','## Tiga wujud zat\nPadat (bentuk dan volume tetap), cair (volume tetap, bentuk mengikuti wadah), dan gas (bentuk dan volume mengikuti wadah).\n\n## Perubahan wujud\nMencair (padat → cair), membeku (cair → padat), menguap (cair → gas), mengembun (gas → cair), menyublim (padat → gas), dan mengkristal (gas → padat).\n\n## Air sebagai contoh\nPada tekanan 1 atm, air membeku pada 0 °C dan mendidih pada 100 °C. Saat berubah wujud, suhu zat tetap meskipun kalor terus diberikan.\n\n## Partikel zat\nPartikel padat rapat dan hanya bergetar. Partikel cair saling bergeser. Partikel gas bergerak bebas dan berjauhan.'],[3,'Senyawa karbon: alkana','Hidrokarbon dengan ikatan tunggal.','## Hidrokarbon\nHidrokarbon adalah senyawa yang hanya terdiri dari atom karbon (C) dan hidrogen (H). Atom karbon dapat membentuk 4 ikatan kovalen.\n\n## Alkana\nAlkana hanya memiliki ikatan tunggal, dengan rumus umum CₙH₂ₙ₊₂. Namanya berakhiran -ana: metana (CH₄), etana (C₂H₆), propana (C₃H₈), butana (C₄H₁₀).\n\n## Kegunaan\nMetana terdapat pada gas alam, propana dan butana pada LPG, serta oktana pada bensin.\n\n## Sifat\nAlkana tidak larut dalam air dan mudah terbakar. Pembakaran sempurna menghasilkan CO₂ dan H₂O.'],[4,'Puisi','Unsur pembangun dan cara menafsirkannya.','## Pengertian\nPuisi adalah karangan terikat yang mengungkapkan perasaan dan pikiran dengan bahasa yang padat dan indah.\n\n## Unsur pembangun\n• Diksi: pilihan kata.\n• Rima: persamaan bunyi pada baris-baris puisi.\n• Baris dan bait: baris adalah satu larik, bait adalah kumpulan baris.\n• Majas dan citraan: bahasa kiasan dan gambaran pancaindra.\n• Tema dan amanat: gagasan utama dan pesan.\n\n## Cara menafsirkan\nBaca berulang kali, cari kata kunci, lalu hubungkan dengan tema. Makna puisi sering bersifat kiasan, bukan arti harfiah.'],[4,'Teks berita','Unsur 5W + 1H dan struktur berita.','## Pengertian\nTeks berita melaporkan peristiwa penting atau menarik secara faktual, aktual, dan objektif.\n\n## Unsur 5W + 1H\nWhat (apa), Who (siapa), Where (di mana), When (kapan), Why (mengapa), dan How (bagaimana).\n\n## Struktur\nJudul, teras berita (bagian awal yang memuat unsur terpenting), tubuh berita (rincian), dan ekor berita (keterangan tambahan).\n\n## Contoh teras\nBanjir merendam 200 rumah di Kelurahan Mawar pada Senin pagi akibat hujan deras sejak malam.'],[5,'Masa praaksara','Manusia purba dan zaman batu di Indonesia.','## Pengertian\nMasa praaksara (prasejarah) adalah masa sebelum manusia mengenal tulisan. Pengetahuan tentang masa ini berasal dari fosil, alat batu, dan peninggalan lain yang diteliti para ahli.\n\n## Manusia purba di Indonesia\n• Meganthropus paleojavanicus: berahang besar, fosilnya ditemukan di Sangiran, Jawa Tengah.\n• Pithecanthropus erectus (Homo erectus): ditemukan Eugene Dubois di Trinil, Ngawi, pada 1891.\n• Homo wajakensis dan Homo sapiens: manusia modern awal, misalnya fosil dari Wajak.\n• Homo floresiensis: ditemukan di Liang Bua, Flores, pada 2003.\n\n## Zaman batu\n• Paleolitikum (batu tua): kapak perimbas, hidup berpindah-pindah, berburu dan meramu.\n• Mesolitikum (batu tengah): mulai menetap sementara di gua dan di tepi pantai, meninggalkan tumpukan sampah kulit kerang (kjokkenmoddinger).\n• Neolitikum (batu muda): bercocok tanam, menetap, membuat kapak persegi dan gerabah.\n• Megalitikum (batu besar): menhir, dolmen, sarkofagus, dan punden berundak untuk memuja arwah leluhur.\n\n## Zaman logam\nManusia membuat alat dari perunggu (nekara dan kapak corong) dan besi. Masyarakat mulai mengenal pembagian kerja dan pemimpin, yang menjadi dasar terbentuknya kerajaan.'],[5,'Perang Dunia I dan II','Dua perang besar yang mengubah dunia.','## Perang Dunia I (1914–1918)\nPenyebab jangka panjangnya adalah persaingan imperialisme, militerisme, nasionalisme, dan sistem aliansi. Pemicunya adalah pembunuhan Pangeran Franz Ferdinand dari Austria-Hongaria di Sarajevo pada 28 Juni 1914. Kubu Sekutu (Inggris, Prancis, Rusia, kemudian Amerika Serikat) berhadapan dengan Blok Sentral (Jerman, Austria-Hongaria, Turki Usmani). Perang berakhir dengan kekalahan Blok Sentral dan Perjanjian Versailles (1919).\n\n## Antara dua perang\nDepresi Besar (1929) dan kekecewaan atas Perjanjian Versailles membuat paham fasisme dan Nazi berkembang di Italia dan Jerman, serta militerisme di Jepang.\n\n## Perang Dunia II (1939–1945)\nDimulai saat Jerman di bawah Adolf Hitler menyerbu Polandia pada 1 September 1939. Sekutu (Inggris, Uni Soviet, Amerika Serikat, dan lainnya) berhadapan dengan Blok Poros (Jerman, Italia, Jepang). Serangan Jepang ke Pearl Harbor pada Desember 1941 membuat Amerika Serikat ikut berperang. Jerman menyerah pada Mei 1945, sedangkan Jepang menyerah pada Agustus 1945 setelah bom atom dijatuhkan di Hiroshima dan Nagasaki.\n\n## Akibat\nJutaan orang tewas dan ekonomi banyak negara hancur. Perserikatan Bangsa-Bangsa (PBB) berdiri pada 1945.\n\n## Hubungan dengan Indonesia\nKekalahan Jepang pada 1945 menciptakan kekosongan kekuasaan yang dimanfaatkan Indonesia untuk memproklamasikan kemerdekaan.'],[6,'Tata surya','Matahari, delapan planet, dan benda langit lainnya.','## Anggota tata surya\nTata surya terdiri dari Matahari sebagai pusat, delapan planet, planet kerdil (misalnya Pluto), satelit alami, asteroid, komet, dan meteoroid.\n\n## Delapan planet\nUrutan dari Matahari: Merkurius, Venus, Bumi, Mars, Jupiter, Saturnus, Uranus, Neptunus. Empat planet pertama berbatu (terestrial), Jupiter dan Saturnus adalah raksasa gas, Uranus dan Neptunus adalah raksasa es.\n\n## Satuan astronomi\nJarak Bumi–Matahari sekitar 150 juta km disebut 1 satuan astronomi (SA). Neptunus berjarak sekitar 30 SA.\n\n## Ingat\nPlanet yang lebih jauh punya orbit lebih panjang dan bergerak lebih lambat, sehingga "setahun"-nya jauh lebih lama.'],[6,'Matahari','Bintang terdekat dan sumber energi bagi Bumi.','## Bintang terdekat\nMatahari adalah bintang di pusat tata surya. Diameternya sekitar 109 kali diameter Bumi dan usianya sekitar 4,6 miliar tahun.\n\n## Sumber energi\nDi inti Matahari (suhu sekitar 15 juta °C), atom hidrogen bergabung menjadi helium lewat fusi nuklir dan melepaskan energi yang sangat besar.\n\n## Lapisan\nInti, zona radiasi, zona konveksi, fotosfer (permukaan, sekitar 5.500 °C), kromosfer, dan korona. Bintik Matahari adalah daerah yang lebih dingin pada fotosfer.\n\n## Pengaruh bagi Bumi\nMemberi cahaya dan panas, menggerakkan cuaca, dan menjadi sumber energi fotosintesis. Jangan pernah melihat Matahari langsung tanpa pelindung mata khusus.'],[6,'Bumi: rotasi, revolusi, dan musim','Penyebab siang malam, tahun kabisat, dan musim.','## Rotasi\nBumi berputar pada porosnya dari barat ke timur, satu putaran sekitar 24 jam. Akibatnya terjadi siang dan malam, serta Matahari tampak bergerak dari timur ke barat.\n\n## Revolusi\nBumi mengelilingi Matahari dalam waktu sekitar 365,25 hari. Karena itu ada tahun kabisat (366 hari) setiap empat tahun.\n\n## Musim\nSumbu Bumi miring sekitar 23,5°. Saat belahan utara condong ke Matahari, di sana musim panas dan belahan selatan musim dingin. Indonesia berada di dekat khatulistiwa, sehingga hanya mengenal musim hujan dan kemarau.'],[6,'Bulan, fase, dan gerhana','Fase Bulan, gerhana, dan pasang surut.','## Bulan\nBulan adalah satelit alami Bumi. Ia tidak memancarkan cahaya sendiri, tetapi memantulkan cahaya Matahari. Satu kali mengelilingi Bumi memakan waktu sekitar 27,3 hari.\n\n## Fase Bulan\nSatu siklus fase sekitar 29,5 hari: bulan baru → sabit → kuartal pertama → cembung → purnama → cembung → kuartal akhir → sabit → bulan baru.\n\n## Gerhana\nGerhana Matahari: Bulan berada di antara Matahari dan Bumi (saat bulan baru). Gerhana Bulan: Bumi berada di antara Matahari dan Bulan (saat purnama).\n\n## Pasang surut\nGravitasi Bulan menyebabkan air laut pasang dan surut. Pasang tertinggi terjadi saat bulan baru dan purnama.'],[6,'Gravitasi dan orbit','Gaya tarik antarbenda dan gerak planet.','## Gravitasi\nGravitasi adalah gaya tarik antarbenda bermassa. Menurut Newton, F = G × m₁ × m₂ ÷ r². Gaya makin besar jika massa besar dan makin kecil jika jarak jauh.\n\n## Berat dan massa\nMassa adalah banyaknya zat (kg) dan tidak berubah. Berat W = m × g (newton) bergantung pada gravitasi tempatnya. Percepatan gravitasi di Bumi sekitar 9,8 m/s², di Bulan sekitar 1,6 m/s².\n\n## Orbit dan hukum Kepler\nPlanet mengorbit Matahari dengan lintasan berbentuk elips. Planet bergerak lebih cepat saat dekat Matahari dan lebih lambat saat jauh. Kuadrat periode orbit sebanding dengan pangkat tiga jarak rata-ratanya.'],[6,'Bintang dan galaksi','Warna, daur hidup bintang, dan galaksi.','## Bintang\nBintang adalah bola gas panas yang memancarkan cahayanya sendiri lewat fusi nuklir. Warna bintang menunjukkan suhunya: merah paling dingin, kuning menengah, dan biru paling panas.\n\n## Daur hidup\nBintang lahir dari awan gas dan debu (nebula). Bintang seukuran Matahari akhirnya menjadi raksasa merah lalu katai putih. Bintang yang sangat masif berakhir sebagai supernova, lalu menjadi bintang neutron atau lubang hitam.\n\n## Galaksi\nGalaksi adalah kumpulan miliaran bintang, gas, dan debu. Tata surya berada di galaksi Bima Sakti yang berbentuk spiral. Galaksi besar terdekat adalah Andromeda.'],[6,'Teleskop dan pengamatan langit','Jenis teleskop dan cara menghitung perbesarannya.','## Fungsi teleskop\nTeleskop mengumpulkan cahaya sehingga objek redup tampak lebih terang dan lebih rinci.\n\n## Jenis teleskop\nRefraktor memakai lensa. Reflektor memakai cermin. Teleskop radio menangkap gelombang radio, dan teleskop luar angkasa (misalnya Hubble) bebas dari gangguan atmosfer.\n\n## Perbesaran\nM = fo ÷ fe, dengan fo panjang fokus lensa objektif dan fe panjang fokus lensa okuler. Contoh: fo = 1.000 mm dan fe = 20 mm → M = 50 kali.\n\n## Tips mengamati\nCari tempat gelap jauh dari lampu kota, beri waktu mata beradaptasi sekitar 20 menit, dan mulailah dari objek terang seperti Bulan atau Jupiter.'],[6,'Eksplorasi antariksa','Dari Sputnik sampai stasiun luar angkasa.','## Awal perlombaan antariksa\n1957: Uni Soviet meluncurkan Sputnik 1, satelit buatan pertama. 1961: Yuri Gagarin menjadi manusia pertama di luar angkasa.\n\n## Ke Bulan\n20 Juli 1969: Neil Armstrong dan Buzz Aldrin dari misi Apollo 11 menjadi manusia pertama yang berjalan di Bulan.\n\n## Wahana dan stasiun\nVoyager 1 dan 2 (1977) menjelajahi planet-planet luar dan kini berada di ruang antarbintang. Stasiun Luar Angkasa Internasional (ISS) dihuni terus-menerus sejak tahun 2000.\n\n## Manfaat\nTeknologi antariksa menghasilkan satelit komunikasi, GPS, ramalan cuaca, dan pemantauan lingkungan.'],[6,'Alam semesta','Big Bang, pengembangan, dan tahun cahaya.','## Big Bang\nMenurut teori Big Bang, alam semesta bermula dari keadaan yang sangat panas dan padat sekitar 13,8 miliar tahun lalu, lalu terus mengembang.\n\n## Bukti pengembangan\nGalaksi-galaksi jauh tampak menjauh dari kita, dan makin jauh galaksinya makin cepat ia menjauh. Radiasi latar kosmik juga merupakan sisa cahaya dari alam semesta awal.\n\n## Tahun cahaya\nSatu tahun cahaya adalah jarak yang ditempuh cahaya dalam satu tahun, sekitar 9,46 triliun km. Ini satuan jarak, bukan waktu. Cahaya Matahari butuh 8,3 menit untuk sampai ke Bumi.\n\n## Isi alam semesta\nMateri biasa hanya sekitar 5%. Sisanya adalah materi gelap dan energi gelap yang belum dipahami sepenuhnya.'],[7,'Pengantar logika','Pernyataan, penalaran deduktif, dan induktif.','## Apa itu logika?\nLogika adalah ilmu tentang cara berpikir yang benar. Bahan dasarnya adalah pernyataan (proposisi), yaitu kalimat yang pasti benar atau salah. "Jakarta adalah ibu kota Indonesia" adalah pernyataan, sedangkan "Tolong tutup pintu" bukan.\n\n## Dua jenis penalaran\nDeduktif: dari hal umum ke khusus. Jika premis benar dan bentuknya sah, kesimpulan pasti benar. Induktif: dari contoh khusus ke kesimpulan umum, sehingga kesimpulannya hanya mungkin benar.\n\n## Silogisme\nPremis 1: Semua manusia fana. Premis 2: Sokrates adalah manusia. Kesimpulan: Sokrates fana.\n\n## Sahih dan benar\nArgumen sahih (valid) jika kesimpulannya mengikuti premis. Argumen yang sahih tetapi berpremis salah tetap bisa berkesimpulan salah.'],[7,'Logika proposisi','Konektif dan tabel kebenaran.','## Konektif\nNegasi (¬P): tidak P. Konjungsi (P ∧ Q): P dan Q, benar jika keduanya benar. Disjungsi (P ∨ Q): P atau Q, benar jika salah satu atau keduanya benar. Implikasi (P → Q): jika P maka Q, hanya salah jika P benar dan Q salah.\n\n## Tabel kebenaran\nTabel memuat semua kemungkinan nilai benar atau salah. Dengan dua pernyataan ada 2² = 4 baris.\n\n## Contoh\nJika hujan, tanah basah. Implikasi ini hanya terbukti salah oleh kasus ketika hujan turun tetapi tanah tidak basah.\n\n## Tips\nCoba semua kombinasi pada simulasi di bawah.'],[7,'Kesesatan berpikir','Pola penalaran yang tampak benar tetapi keliru.','## Pengertian\nKesesatan berpikir (fallasi) adalah kesalahan penalaran yang membuat argumen tampak meyakinkan padahal tidak sahih.\n\n## Contoh yang sering muncul\n• Ad hominem: menyerang orangnya, bukan argumennya.\n• Strawman: memelintir pendapat lawan agar mudah dibantah.\n• Pos hoc: mengira A menyebabkan B hanya karena A terjadi lebih dulu.\n• Dilema palsu: hanya memberi dua pilihan padahal ada pilihan lain.\n• Lereng licin: mengklaim satu langkah kecil pasti berujung bencana besar.\n\n## Cara menghindari\nPeriksa premisnya, cari bukti, dan nilai argumennya, bukan siapa yang mengatakannya.'],[7,'Pengantar filsafat','Cabang filsafat dan tokoh awalnya.','## Arti filsafat\nFilsafat berasal dari bahasa Yunani philo (cinta) dan sophia (kebijaksanaan). Filsafat mengajukan pertanyaan mendasar tentang realitas, pengetahuan, dan nilai, lalu menjawabnya dengan penalaran.\n\n## Cabang utama\n• Metafisika: apa yang sungguh ada?\n• Epistemologi: bagaimana kita mengetahui sesuatu?\n• Etika: apa yang baik dan benar?\n• Logika: bagaimana berpikir yang sahih?\n• Estetika: apa itu keindahan?\n\n## Tokoh awal\nSokrates mengajarkan bertanya terus-menerus untuk menguji gagasan. Plato mendirikan Akademi, dan muridnya, Aristoteles, merumuskan dasar logika. Descartes terkenal dengan ucapan Cogito ergo sum (aku berpikir, maka aku ada).'],[8,'Sistem bilangan biner','Cara komputer menyimpan angka.','## Mengapa biner?\nKomputer memakai sirkuit elektronik yang punya dua keadaan: mati (0) dan hidup (1). Karena itu semua data disimpan sebagai bilangan biner (basis 2). Satu angka biner disebut bit, dan 8 bit membentuk 1 byte.\n\n## Nilai tempat\nDari kanan ke kiri, tiap posisi bernilai 1, 2, 4, 8, 16, 32, 64, 128. Biner 1011 = 8 + 0 + 2 + 1 = 11.\n\n## Desimal ke biner\nBagi bilangan dengan 2 berulang kali dan catat sisanya dari bawah ke atas. 13 ÷ 2 = 6 sisa 1, 6 ÷ 2 = 3 sisa 0, 3 ÷ 2 = 1 sisa 1, 1 ÷ 2 = 0 sisa 1, jadi 13 = 1101.\n\n## Kapasitas\n8 bit dapat menyimpan 2⁸ = 256 nilai (0 sampai 255).'],[8,'Algoritma dan pseudocode','Langkah sistematis menyelesaikan masalah.','## Algoritma\nAlgoritma adalah urutan langkah yang jelas dan berhingga untuk menyelesaikan suatu masalah. Setiap algoritma punya input (masukan), proses, dan output (keluaran). Algoritma dapat ditulis dengan kalimat, pseudocode, atau diagram alir.\n\n## Struktur dasar\nUrutan (langkah satu per satu), percabangan (jika ... maka ...), dan perulangan (ulangi sampai ...).\n\n## Contoh: bilangan terbesar\n1. Anggap bilangan pertama paling besar.\n2. Bandingkan dengan bilangan berikutnya.\n3. Jika bilangan itu lebih besar, jadikan sebagai yang terbesar.\n4. Ulangi sampai semua bilangan diperiksa.\n\n## Mencari dengan cepat\nPencarian biner membagi dua daerah pencarian pada data yang sudah terurut, jauh lebih cepat daripada memeriksa satu per satu.'],[8,'Jaringan komputer dan keamanan','Alamat IP, DNS, dan kata sandi yang kuat.','## Jaringan komputer\nJaringan menghubungkan perangkat agar dapat bertukar data. Internet adalah jaringan dari jaringan di seluruh dunia, dihubungkan oleh perangkat seperti router dan switch.\n\n## Alamat dan nama\nSetiap perangkat punya alamat IP (misalnya 192.168.1.5). DNS menerjemahkan nama situs menjadi alamat IP. HTTPS dipakai untuk membuka halaman web dengan data terenkripsi.\n\n## Keamanan dasar\n• Gunakan kata sandi panjang dan unik.\n• Aktifkan verifikasi dua langkah.\n• Waspada tautan dan lampiran mencurigakan (phishing).\n• Perbarui perangkat lunak secara rutin.'],[8,'Berpikir komputasional','Empat pilar menyelesaikan masalah.','## Pengertian\nBerpikir komputasional adalah cara memecahkan masalah dengan langkah yang dapat dikerjakan manusia maupun komputer.\n\n## Empat pilar\n• Dekomposisi: memecah masalah besar menjadi bagian kecil.\n• Pengenalan pola: mencari kesamaan atau keteraturan.\n• Abstraksi: mengambil hal penting dan mengabaikan detail yang tidak perlu.\n• Algoritma: menyusun langkah penyelesaian.\n\n## Contoh\nMerencanakan acara sekolah: pecah menjadi tugas (dekomposisi), kenali pola dari acara sebelumnya, fokus pada anggaran dan jadwal (abstraksi), lalu susun urutan kerja (algoritma).'],[9,'Neuron dan sinaps','Sel saraf dan cara mereka berkomunikasi.','## Neuron\nNeuron adalah sel saraf. Dendrit menerima sinyal, badan sel mengolahnya, dan akson menghantarkan impuls ke ujungnya. Selubung mielin pada akson mempercepat hantaran. Otak manusia memiliki sekitar 86 miliar neuron.\n\n## Impuls saraf\nNeuron menembakkan impuls listrik hanya jika rangsangan mencapai ambang. Prinsipnya semua-atau-tidak: kekuatan satu impuls selalu sama, dan rangsangan yang lebih kuat membuat impuls lebih sering.\n\n## Sinaps\nDi sinaps, neuron mengirim sinyal kimia berupa neurotransmiter (misalnya dopamin, serotonin, dan asetilkolin) ke neuron berikutnya.'],[9,'Bagian otak dan fungsinya','Serebrum, serebelum, batang otak, dan lainnya.','## Bagian utama\nSerebrum (otak besar) mengatur berpikir, gerakan sadar, dan indra. Serebelum (otak kecil) mengatur keseimbangan dan koordinasi gerak. Batang otak mengatur fungsi vital seperti napas dan detak jantung.\n\n## Empat lobus serebrum\nFrontal (perencanaan dan keputusan), parietal (perabaan dan orientasi ruang), temporal (pendengaran dan memori), dan oksipital (penglihatan).\n\n## Struktur lain\nHipokampus berperan membentuk memori baru. Amigdala berperan dalam emosi, terutama rasa takut.\n\n## Dua belahan\nOtak terbagi menjadi belahan kiri dan kanan yang berkomunikasi lewat korpus kalosum. Anggapan bahwa seseorang berotak kiri atau berotak kanan tidak didukung bukti ilmiah.'],[9,'Memori dan belajar','Jenis memori dan cara belajar yang efektif.','## Tiga tahap memori\nMemori sensorik menyimpan informasi sangat singkat (beberapa detik). Memori jangka pendek (memori kerja) menampung sekitar 4 sampai 7 hal selama puluhan detik. Memori jangka panjang menyimpan informasi dalam waktu lama.\n\n## Konsolidasi\nInformasi baru dikukuhkan menjadi memori jangka panjang, dan tidur berperan penting dalam proses ini.\n\n## Kurva lupa\nHermann Ebbinghaus menunjukkan bahwa kita cepat lupa pada awalnya, lalu melambat. Mengulang pada selang waktu yang makin panjang (spaced repetition) memperlambat lupa.\n\n## Tips belajar\nUji dirimu sendiri, belajar sedikit-sedikit tetapi sering, dan cukup tidur.'],[9,'Tidur dan otak','Siklus tidur dan manfaatnya bagi otak.','## Siklus tidur\nTidur terdiri dari fase NREM (ringan sampai tidur dalam) dan REM (otak aktif, banyak mimpi). Satu siklus berlangsung sekitar 90 menit dan berulang 4 sampai 6 kali semalam.\n\n## Manfaat bagi otak\nTidur membantu konsolidasi memori, memulihkan energi, dan membersihkan zat sisa di otak. Kurang tidur menurunkan konsentrasi, suasana hati, dan daya ingat.\n\n## Kebutuhan tidur\nRemaja sekitar 8 sampai 10 jam, dewasa sekitar 7 sampai 9 jam per hari.\n\n## Kebiasaan baik\nTidur dan bangun pada jam yang sama, hindari layar terang sebelum tidur, dan batasi kafein di sore hari.']];

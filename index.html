1:{t:'Simulasi Hukum II Newton',d:'Geser massa dan gaya, lalu lihat percepatan benda.',c:()=>sl('m','Massa',1,20,'kg')+sl('f','Gaya',0,100,'N'),o:()=>{const a=rd(DV.f/DV.m);return`<p class="res"><b>a = F ÷ m = ${DV.f} ÷ ${DV.m} = ${a} m/s²</b></p>${mb(a*5)}<p class="mut">${a?`Dari diam, setelah 3 detik kecepatannya ${rd(a*3)} m/s. Gaya yang sama pada massa lebih besar menghasilkan percepatan lebih kecil.`:'Tanpa gaya, benda tidak berakselerasi (Hukum I).'}</p>`}},
8:{t:'Energi potensial berubah jadi energi kinetik',d:'Benda dilepas dari ketinggian 20 m. Geser ketinggiannya saat jatuh.',c:()=>sl('mm','Massa',1,10,'kg')+sl('h','Ketinggian benda',0,20,'m'),o:()=>{const m=DV.mm,h=DV.h,ep=m*10*h,ek=m*10*(20-h),t=m*200;return`<p class="res"><b>Ep = m × g × h = ${m} × 10 × ${h} = ${ep} J</b></p>${mb(ep/t*100,'#5b3df5')}<p class="res"><b>Ek = Ep awal − Ep sekarang = ${ek} J</b></p>${mb(ek/t*100,'#d6336c')}<p class="mut">Ep + Ek selalu ${t} J. Semakin rendah benda, semakin besar energi kinetiknya.</p>`}},
9:{t:'Hukum Ohm dan rangkaian',d:'Ubah tegangan, hambatan, dan jenis rangkaian.',c:()=>`<div class="row">${bt('md','s','Seri')}${bt('md','p','Paralel')}</div>`+sl('v','Tegangan',1,24,'V')+sl('r1','R₁',1,20,'Ω')+sl('r2','R₂',1,20,'Ω'),o:()=>{const{v,r1,r2,md}=DV;if(md=='s'){const rt=r1+r2,i=rd(v/rt);return`<p class="res"><b>R total = ${r1} + ${r2} = ${rt} Ω</b></p><p class="res"><b>I = V ÷ R = ${v} ÷ ${rt} = ${i} A</b></p><p class="mut">Seri: arus ${i} A sama di kedua hambatan. Tegangan terbagi menjadi ${rd(i*r1)} V di R₁ dan ${rd(i*r2)} V di R₂.</p>`}const rt=rd(r1*r2/(r1+r2)),a=rd(v/r1),b=rd(v/r2);return`<p class="res"><b>R total = ${rt} Ω</b></p><p class="res"><b>I total = ${a} + ${b} = ${rd(a+b)} A</b></p><p class="mut">Paralel: setiap cabang bertegangan ${v} V. Hambatan total selalu lebih kecil dari hambatan terkecil.</p>`}},
2:{t:'Faktor pembatas fotosintesis',d:'Fotosintesis hanya secepat faktor yang paling kurang. Coba turunkan salah satunya.',c:()=>sl('li','Cahaya',0,100,'%')+sl('co','Karbon dioksida',0,100,'%')+sl('ai','Air',0,100,'%'),o:()=>{const[k,r]=Object.entries({'Cahaya':DV.li,'Karbon dioksida':DV.co,'Air':DV.ai}).sort((a,b)=>a[1]-b[1])[0];return`<p class="res"><b>Laju fotosintesis: ${r}%</b></p>${mb(r,'#3fae6a')}<p class="mut">${r?`Faktor pembatas: <b>${k}</b>. Menambah faktor lain tidak menaikkan hasil sebelum faktor ini dinaikkan.`:`${k} habis, sehingga fotosintesis berhenti.`}</p>`}},
10:{t:'Telusuri perjalanan makanan',d:'Pilih organ untuk melihat apa yang terjadi di dalamnya.',c:()=>`<div class="row">${OG.map((x,i)=>bt('og',i,(i+1)+'. '+x[0])).join('')}</div>`,o:()=>{const x=OG[DV.og];return`<h3>${x[0]}</h3><p style="margin:6px 0">${x[1]}</p><p class="mut">${x[2]}</p>${mb((DV.og+1)*20)}<p class="mut">Tahap ${DV.og+1} dari 5</p>`}},
11:{t:'Persilangan dengan kotak Punnett',d:'Bunga merah (A) dominan, bunga putih (a) resesif. Pilih genotipe kedua induk.',c:()=>['p1','p2'].map((k,i)=>`<p class="mut" style="margin:0 0 6px">Induk ${i+1}</p><div class="row" style="margin-bottom:10px">${['AA','Aa','aa'].map(g=>bt(k,g,g)).join('')}</div>`).join(''),o:()=>{const a=DV.p1,b=DV.p2,c=[];for(const r of b)for(const q of a)c.push([q,r].sort().join(''));const n={};c.forEach(g=>n[g]=(n[g]||0)+1);const d=c.filter(g=>g.includes('A')).length,cl=g=>g.includes('A')?'background:var(--soft)':'';return`<div class="pn"><i></i><b>${a[0]}</b><b>${a[1]}</b><b>${b[0]}</b><span style="${cl(c[0])}">${c[0]}</span><span style="${cl(c[1])}">${c[1]}</span><b>${b[1]}</b><span style="${cl(c[2])}">${c[2]}</span><span style="${cl(c[3])}">${c[3]}</span></div><p class="res"><b>Genotipe: ${Object.entries(n).map(([g,k])=>k+' '+g).join(' : ')}</b></p><p class="mut">Fenotipe: ${d*25}% merah, ${100-d*25}% putih. Kotak berlatar ungu adalah keturunan berbunga merah.</p>`}},
12:{t:'Skala pH dan indikator universal',d:'Geser nilai pH dan lihat warna indikator serta contoh larutannya.',c:()=>sl('ph','pH',0,14,'',0.5),o:()=>{const p=DV.ph,hue=p<=7?p/7*120:120+(p-7)/7*160,k=p==7?'Netral':(p<7?'Asam':'Basa')+(Math.abs(p-7)>=4?' kuat':' lemah'),e=PH.reduce((a,b)=>Math.abs(b[0]-p)<Math.abs(a[0]-p)?b:a);return`<div style="height:54px;border-radius:14px;background:hsl(${hue} 70% 50%);margin-bottom:12px"></div><p class="res"><b>${k}</b></p><p class="mut">[H⁺] = 10<sup>−${p}</sup> mol/L. Contoh terdekat: ${e[1]}.</p>`}},
13:{t:'Jenis ikatan pada senyawa',d:'Pilih senyawa untuk melihat bagaimana atom-atomnya berikatan.',c:()=>`<div class="row">${CB.map((x,i)=>bt('cb',i,x[0])).join('')}</div>`,o:()=>{const x=CB[DV.cb];return`<h3>${x[0]} · ${x[1]}</h3><p style="margin:6px 0">${x[2]}</p><p class="mut">Penyusun: ${x[3]}.<br>Menghantar listrik? ${x[4]}</p>`}},
20:{t:'Simulasi gerak lurus',d:'Atur kecepatan awal, percepatan, dan waktu.',c:()=>sl('gv','Kecepatan awal',0,20,'m/s')+sl('ga','Percepatan',0,10,'m/s²')+sl('gt','Waktu',0,10,'s'),o:()=>{const{gv:a,ga:b,gt:t}=DV,v=a+b*t,x=a*t+b*t*t/2;return`<p class="res"><b>v = ${a} + ${b} × ${t} = ${rd(v)} m/s</b></p><p class="res"><b>s = ${a}×${t} + ½×${b}×${t}² = ${rd(x)} m</b></p>${mb(x/7)}<p class="mut">${b?'GLBB: kecepatan terus bertambah.':'GLB: kecepatan tetap, jarak naik sebanding waktu.'}</p>`}},
21:{t:'Hukum pemantulan cahaya',d:'Geser sudut datang dan lihat sudut pantulnya.',c:()=>sl('ag','Sudut datang',0,85,'°'),o:()=>{const q=DV.ag*Math.PI/180,dx=80*Math.sin(q),dy=80*Math.cos(q);return`<svg viewBox="0 0 220 120" style="width:100%;max-width:340px" aria-hidden="true"><line x1="10" y1="100" x2="210" y2="100" stroke="currentColor" stroke-width="4"/><line x1="110" y1="15" x2="110" y2="100" stroke="currentColor" stroke-dasharray="4 4" opacity=".5"/><line x1="${110-dx}" y1="${100-dy}" x2="110" y2="100" stroke="#5b3df5" stroke-width="3"/><line x1="110" y1="100" x2="${110+dx}" y2="${100-dy}" stroke="#d6336c" stroke-width="3"/></svg><p class="res"><b>Sudut datang = ${DV.ag}° → sudut pantul = ${DV.ag}°</b></p><p class="mut">Garis putus-putus adalah garis normal. Sinar ungu datang, sinar merah memantul.</p>`}},
22:{t:'Denyut jantung dan curah jantung',d:'Geser denyut nadi. Satu denyut memompa sekitar 70 mL darah.',c:()=>sl('hr','Denyut nadi',40,200,'x/menit'),o:()=>{const h=DV.hr;return`<div><span class="hb" style="animation-duration:${(60/h).toFixed(2)}s">♥</span></div><p class="res"><b>Darah dipompa ≈ ${rd(h*70/1000)} liter/menit</b></p><p class="mut">${h<60?'Di bawah rentang istirahat normal orang dewasa (60–100), kecuali pada atlet terlatih.':h<=100?'Dalam rentang normal orang dewasa saat istirahat (60–100).':'Di atas rentang istirahat normal. Wajar saat berolahraga.'}</p>`}},
23:{t:'Aturan 10% aliran energi',d:'Atur energi pada produsen dan lihat energi di tiap tingkat.',c:()=>sl('en','Energi produsen',1000,20000,'kJ',1000),o:()=>`${['Produsen (padi)','Konsumen I (tikus)','Konsumen II (ular)','Konsumen III (elang)'].map((n,i)=>`<p class="res"><b>${n}: ${rd(DV.en/10**i)} kJ</b></p>${mb(100/10**i,['#3fae6a','#d4a800','#f59e3b','#d6336c'][i])}`).join('')}<p class="mut">Setiap naik satu tingkat, energi tinggal sekitar 10%.</p>`},
24:{t:'Bangun atommu sendiri',d:'Atur jumlah proton dan neutron untuk atom netral.',c:()=>sl('z','Jumlah proton',1,20,'')+sl('n','Jumlah neutron',0,25,''),o:()=>{const z=DV.z,n=DV.n,k=[];let e=z;for(const c of[2,8,8]){if(e<=0)break;const t=Math.min(c,e);k.push(t);e-=t}if(e>0)k.push(e);return`<h3>${NM[z-1]} (${SY[z-1]})</h3><p class="res"><b>Proton ${z} · Elektron ${z} · Neutron ${n}</b></p><p class="mut">Nomor atom ${z}, nomor massa ${z+n}. Lambang isotop: <sup>${z+n}</sup>${SY[z-1]}.<br>Konfigurasi elektron: ${k.join(', ')}.</p>`}},
25:{t:'Setarakan persamaan reaksi',d:'Atur koefisien agar jumlah atom H dan O sama di kedua ruas.',c:()=>sl('ka','Koefisien H₂',1,6,'')+sl('kb','Koefisien O₂',1,6,'')+sl('kc','Koefisien H₂O',1,6,''),o:()=>{const{ka:a,kb:b,kc:c}=DV,h=[2*a,2*c],o=[2*b,c],ok=h[0]==h[1]&&o[0]==o[1];return`<p class="res"><b>${a} H₂ + ${b} O₂ → ${c} H₂O</b></p><p class="mut">Atom H: ${h[0]} di kiri, ${h[1]} di kanan ${h[0]==h[1]?'✓':'✗'}<br>Atom O: ${o[0]} di kiri, ${o[1]} di kanan ${o[0]==o[1]?'✓':'✗'}</p><p class="res"><b>${ok?(b==1?'Setara dan sudah paling sederhana!':'Setara, tetapi masih bisa disederhanakan.'):'Belum setara. Ubah koefisiennya.'}</b></p>`}},
32:{t:'Berapa kalor yang dibutuhkan?',d:'Panaskan air dan hitung kalor Q = m × c × ΔT.',c:()=>sl('km','Massa air',1,10,'kg')+sl('kt','Kenaikan suhu',1,80,'°C'),o:()=>{const q=DV.km*4200*DV.kt;return`<p class="res"><b>Q = ${DV.km} × 4.200 × ${DV.kt} = ${q.toLocaleString('id-ID')} J</b></p><p class="mut">Setara ${rd(q/1000)} kJ. Dengan pemanas 1.000 W, waktunya sekitar ${rd(q/60000)} menit.</p>`}},
33:{t:'Frekuensi dan panjang gelombang',d:'Ubah f dan λ untuk melihat bentuk gelombang dan cepat rambatnya.',c:()=>sl('wf','Frekuensi',1,20,'Hz')+sl('wl','Panjang gelombang',1,10,'m'),o:()=>{const pt=Array.from({length:111},(_,i)=>`${i*2},${40-28*Math.sin(2*Math.PI*i*2/(DV.wl*22))}`).join(' ');return`<svg viewBox="0 0 220 80" style="width:100%;max-width:340px" aria-hidden="true"><polyline points="${pt}" fill="none" stroke="#5b3df5" stroke-width="3"/></svg><p class="res"><b>v = λ × f = ${DV.wl} × ${DV.wf} = ${DV.wl*DV.wf} m/s</b></p><p class="mut">Periode T = 1 ÷ f = ${rd(1/DV.wf)} s. Semakin besar λ, semakin panjang satu gelombang pada gambar.</p>`}},
34:{t:'Berapa udara yang kamu hirup?',d:'Atur laju napas dan volume tiap napas.',c:()=>sl('br','Laju napas',8,40,'x/menit')+sl('tv','Volume tiap napas',300,800,'mL',50),o:()=>`<p class="res"><b>Ventilasi = ${DV.br} × ${DV.tv} mL = ${rd(DV.br*DV.tv/1000)} liter/menit</b></p><p class="mut">Orang dewasa yang beristirahat biasanya bernapas 12–20 kali per menit dengan sekitar 500 mL per napas (6–10 liter/menit). Saat berolahraga, keduanya meningkat.</p>`},
35:{t:'Klasifikasi dari kingdom sampai spesies',d:'Pilih makhluk hidup untuk melihat tingkatan taksonnya.',c:()=>`<div class="row">${TX.map((x,i)=>bt('tx',i,x[0])).join('')}</div>`,o:()=>`${TX[DV.tx][1].map((n,i)=>`<div style="display:flex;align-items:center;gap:10px;margin:6px 0 6px ${i*6}px"><span class="tag" style="min-width:100px;text-align:center">${TL[i]}</span><b style="background:var(--grad);color:#fff;border-radius:10px;padding:5px 12px;font-size:13px">${n}</b></div>`).join('')}<p class="mut" style="margin-top:12px">Nama ilmiah: <i>${TX[DV.tx][1][6]}</i></p>`},
36:{t:'Hitung mol dan jumlah partikel',d:'Pilih zat dan atur massanya.',c:()=>`<div class="row">${MR.map((x,i)=>bt('cm',i,x[0])).join('')}</div>`+sl('mg','Massa',1,200,'g'),o:()=>{const[f,mr]=MR[DV.cm],n=DV.mg/mr;return`<p class="res"><b>n = ${DV.mg} ÷ ${mr} = ${rd(n)} mol</b></p><p class="res"><b>Partikel ≈ ${rd(n*6.022)} × 10²³</b></p><p class="mut">Mr ${f} = ${mr}, jadi 1 mol ${f} bermassa ${mr} g.</p>`}},
37:{t:'Hitung molaritas larutan NaCl',d:'Atur massa garam dan volume larutan.',c:()=>sl('gs','Massa NaCl',1,100,'g')+sl('vl','Volume larutan',0.1,2,'L',0.1),o:()=>{const n=DV.gs/58.5;return`<p class="res"><b>n = ${DV.gs} ÷ 58,5 = ${rd(n)} mol</b></p><p class="res"><b>M = n ÷ V = ${rd(n)} ÷ ${DV.vl} = ${rd(n/DV.vl)} M</b></p><p class="mut">Menambah air menurunkan konsentrasi, sedangkan jumlah mol garam tetap.</p>`}},
44:{t:'Tekanan di dalam air',d:'Selami lebih dalam dan lihat tekanan hidrostatisnya.',c:()=>sl('kd','Kedalaman',0,50,'m'),o:()=>{const p=1000*10*DV.kd;return`<p class="res"><b>P = ρ × g × h = 1.000 × 10 × ${DV.kd} = ${p.toLocaleString('id-ID')} Pa</b></p><p class="mut">Termasuk tekanan udara (≈ 101 kPa), tekanan total ${rd(101.3+p/1000)} kPa, sekitar ${rd((101.3+p/1000)/101.3)} kali tekanan di permukaan.</p>`}},
45:{t:'Hitung waktu gema',d:'Atur jarak ke dinding pemantul.',c:()=>sl('dd','Jarak ke dinding',10,500,'m'),o:()=>{const t=2*DV.dd/340;return`<p class="res"><b>t = 2 × ${DV.dd} ÷ 340 = ${rd(t)} detik</b></p><p class="mut">${t>0.1?'Gema terdengar terpisah dari suara asli (selang lebih dari sekitar 0,1 detik).':'Gema bercampur dengan suara asli sehingga tidak terdengar jelas.'}</p>`}},
46:{t:'Organ ekskresi dan hasil buangannya',d:'Pilih organ untuk melihat zat yang dibuang.',c:()=>`<div class="row">${EX.map((x,i)=>bt('ex',i,x[0])).join('')}</div>`,o:()=>{const x=EX[DV.ex];return`<h3>${x[0]}</h3><p class="res"><b>Hasil: ${x[1]}</b></p><p style="margin:6px 0">Zat yang dibuang: ${x[2]}.</p><p class="mut">${x[3]}</p>`}},
47:{t:'Bandingkan sel hewan dan sel tumbuhan',d:'Pilih jenis sel untuk melihat organel yang dimilikinya.',c:()=>`<div class="row">${bt('sc',0,'Sel hewan')}${bt('sc',1,'Sel tumbuhan')}</div>`,o:()=>CL.map(x=>`<div style="display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line)"><span>${x[0]}</span><b style="color:${x[1+DV.sc]?'#1c9a5b':'#d6336c'}">${x[1+DV.sc]?'✓ Ada':'✗ Tidak ada'}</b></div>`).join('')},
48:{t:'Wujud air pada berbagai suhu',d:'Geser suhu air pada tekanan 1 atm.',c:()=>sl('wt','Suhu air',-20,120,'°C'),o:()=>{const t=DV.wt,[a,b]=t<0?['Padat (es)','Partikel rapat dan hanya bergetar di tempatnya.']:t==0?['Titik beku/lebur','Es dan air cair bisa ada bersama. Suhu tetap 0 °C selama berubah wujud.']:t<100?['Cair','Partikel saling bergeser, volume tetap, bentuk mengikuti wadah.']:t==100?['Titik didih','Air dan uap air bisa ada bersama. Suhu tetap 100 °C selama mendidih.']:['Gas (uap air)','Partikel bergerak bebas dan berjauhan.'];return`<p class="res"><b>${t} °C → ${a}</b></p><p class="mut">${b}</p>`}},
49:{t:'Deret alkana',d:'Tambahkan atom karbon dan lihat rumus serta namanya.',c:()=>sl('cn','Jumlah atom C',1,10,''),o:()=>{const n=DV.cn;return`<h3>${AK[n-1]}</h3><p class="res"><b>C<sub>${n}</sub>H<sub>${2*n+2}</sub></b></p><p class="mut">Mr = 12 × ${n} + 1 × ${2*n+2} = ${14*n+2}. ${n<=4?'Berwujud gas pada suhu ruang.':'Berwujud cair pada suhu ruang.'}</p>`}},
54:{t:'Jelajahi planet',d:'Pilih planet untuk melihat jarak, lama setahun, dan jenisnya.',c:()=>`<div class="row">${PL.map((x,i)=>bt('pl',i,x[0])).join('')}</div>`,o:()=>{const x=PL[DV.pl];return`<h3>${x[0]} · ${x[3]}</h3><p class="res"><b>Jarak dari Matahari: ${x[1]} SA (≈ ${rd(x[1]*149.6)} juta km)</b></p><p class="mut">Satu tahun di ${x[0]} setara ${x[2]} di Bumi.</p>${mb(x[1]/30.1*100,'#5b3df5')}`}},
55:{t:'Cahaya Matahari di planet lain',d:'Atur jarak dari Matahari dalam satuan astronomi (SA).',c:()=>sl('ja','Jarak dari Matahari',0.4,30,'SA',0.1),o:()=>{const a=DV.ja;return`<p class="res"><b>Cahaya tiba dalam ${rd(499*a/60)} menit</b></p><p class="res"><b>Intensitas = 1 ÷ ${a}² = ${rd(1/(a*a))} kali di Bumi</b></p><p class="mut">Semakin jauh, cahaya makin redup menurut kuadrat jarak.</p>`}},
56:{t:'Posisi Matahari sepanjang tahun',d:'Geser hari dalam setahun untuk melihat posisi Matahari dan musim di belahan utara.',c:()=>sl('hi','Hari ke-',1,365,''),o:()=>{const d=DV.hi,e=23.44*Math.sin(2*Math.PI*(d-80)/365),m=d>=80&&d<172?'Musim semi':d>=172&&d<266?'Musim panas':d>=266&&d<355?'Musim gugur':'Musim dingin';return`<p class="res"><b>Matahari tepat di atas lintang ${rd(Math.abs(e))}° ${e>=0?'LU':'LS'}</b></p><p class="mut">Belahan utara: ${m}. Belahan selatan mengalami musim sebaliknya. Di dekat khatulistiwa, perbedaan musimnya kecil.</p>`}},
57:{t:'Fase Bulan',d:'Geser hari sejak bulan baru (satu siklus sekitar 29,5 hari).',c:()=>sl('bd','Hari ke-',0,29,''),o:()=>{const i=Math.round(DV.bd/29.53*8)%8,f=(1-Math.cos(2*Math.PI*DV.bd/29.53))/2;return`<div style="font-size:64px;line-height:1.1" aria-hidden="true">${['🌑','🌒','🌓','🌔','🌕','🌖','🌗','🌘'][i]}</div><p class="res"><b>${['Bulan baru','Sabit awal','Kuartal pertama','Cembung awal','Purnama','Cembung akhir','Kuartal akhir','Sabit akhir'][i]}</b></p><p class="mut">Bagian Bulan yang tersinari sekitar ${Math.round(f*100)}%.</p>`}},
58:{t:'Beratmu di dunia lain',d:'Massa tidak berubah, tetapi berat bergantung pada gravitasi.',c:()=>`<div class="row">${GB.map((x,i)=>bt('gp',i,x[0])).join('')}</div>`+sl('bm','Massa',10,100,'kg'),o:()=>{const[n,g]=GB[DV.gp];return`<p class="res"><b>W = m × g = ${DV.bm} × ${g} = ${rd(DV.bm*g)} N</b></p><p class="mut">Di ${n}, gravitasinya ${g} m/s² (${rd(g/9.81)} kali Bumi). Massamu tetap ${DV.bm} kg.</p>`}},
59:{t:'Warna dan suhu bintang',d:'Atur suhu permukaan bintang dan lihat warna serta kelas spektrumnya.',c:()=>sl('tk','Suhu permukaan',2500,40000,'K',500),o:()=>{const x=SP.filter(s=>DV.tk>=s[0]).pop();return`<div style="height:54px;border-radius:14px;background:${x[3]};margin-bottom:12px"></div><p class="res"><b>Kelas ${x[1]} · ${x[2]}</b></p><p class="mut">${DV.tk>=5200&&DV.tk<6000?'Suhu ini mirip Matahari (sekitar 5.800 K). ':''}Bintang yang lebih panas tampak lebih biru, yang lebih dingin tampak lebih merah.</p>`}},
60:{t:'Hitung perbesaran teleskop',d:'Atur panjang fokus lensa objektif dan okuler.',c:()=>sl('fo','Fokus objektif',400,2000,'mm',100)+sl('fe','Fokus okuler',5,40,'mm'),o:()=>`<p class="res"><b>M = ${DV.fo} ÷ ${DV.fe} = ${rd(DV.fo/DV.fe)} kali</b></p><p class="mut">Okuler berfokus pendek memberi perbesaran lebih besar, tetapi gambar lebih redup dan lebih mudah goyang.</p>`},
61:{t:'Lini masa eksplorasi antariksa',d:'Pilih tahun untuk melihat peristiwanya.',c:()=>`<div class="row">${EK.map((x,i)=>bt('tl',i,x[0])).join('')}</div>`,o:()=>{const x=EK[DV.tl];return`<h3>${x[0]} · ${x[1]}</h3><p style="margin:6px 0">${x[2]}</p>`}},

notes(){return`<div class="grid g2" style="align-items:start"><div class="card"><h2>Catatan baru</h2><label class="mut" for="nt" style="display:block;margin:14px 0 6px">Judul</label><input id="nt"><label class="mut" for="nb" style="display:block;margin:14px 0 6px">Isi</label><textarea id="nb" rows="5"></textarea><button class="btn" style="margin-top:16px" data-a="addnote">Simpan catatan</button></div><div class="card"><h2>Catatanmu</h2>${D.notes.map((n,i)=>`<div class="item"><div><b>${esc(n.t)}</b><p>${esc(n.b)}</p></div><button class="ghost" data-d="notes:${i}" aria-label="Hapus catatan">${ic('x',18)}</button></div>`).join('')||'<p class="mut" style="margin-top:8px">Belum ada catatan. Tulis yang pertama di sebelah kiri.</p>'}</div></div>`},
plan(){return`<div class="card" style="margin-bottom:16px"><div class="row" style="margin:0"><input id="pt" type="time" style="max-width:150px" aria-label="Jam"><select id="ps" style="max-width:220px" aria-label="Mata pelajaran">${SUB.map(s=>`<option>${s[0]}</option>`).join('')}</select><input id="pn" placeholder="Apa yang akan dipelajari?" style="flex:1;min-width:180px"><button class="btn" data-a="addplan">Tambah jadwal</button></div></div><div class="card"><h2>Jadwal hari ini</h2>${[...D.plan].map((p,i)=>[p,i]).sort((a,b)=>a[0].t.localeCompare(b[0].t)).map(([p,i])=>`<div class="item"><span class="time">${p.t}</span><div><b>${esc(p.s)}</b><p>${esc(p.n||'Tanpa catatan')}</p></div><button class="ghost" data-d="plan:${i}" aria-label="Hapus jadwal">${ic('x',18)}</button></div>`).join('')||'<p class="mut" style="margin-top:8px">Jadwal masih kosong. Tambahkan sesi belajar pertamamu.</p>'}</div>`},
set(){return`<div class="card" style="max-width:640px"><h2>Pengaturan</h2><label class="mut" for="nm" style="display:block;margin:14px 0 6px">Nama panggilan</label><input id="nm" value="${esc(D.name)}"><div class="sw"><div><b>Mode gelap</b><p class="mut">Tampilan lebih nyaman di malam hari.</p></div><button class="tg ${D.dark?'on':''}" data-a="theme" role="switch" aria-checked="${!!D.dark}" aria-label="Mode gelap"></button></div><div class="sw"><div><b>Kurangi animasi</b><p class="mut">Matikan transisi halus.</p></div><button class="tg ${D.calm?'on':''}" data-a="calm" role="switch" aria-checked="${!!D.calm}" aria-label="Kurangi animasi"></button></div></div>`}};
function render(){shell();$('#view').innerHTML=V[D.page]();save();ssGo()}
const go=p=>{const same=p==D.page&&M===null;D.page=p;M=null;document.body.classList.remove('open');same?render():load();scrollTo(0,0)};
const A={mini(){D.mini=D.mini?0:1;render()},open(){document.body.classList.add('open')},close(){document.body.classList.remove('open')},theme(){D.dark=D.dark?0:1;render()},calm(){D.calm=D.calm?0:1;render()},back(){M=null;render()},
 start(x){if(x!==undefined)QS=x;const l=BANK.filter(q=>QS<0||q[0]==QS).sort(()=>Math.random()-.5);QZ=QS<0?l.slice(0,8):l;Q={i:0,s:0,a:null,on:1};render()},
 next(){Q.i++;Q.a=null;if(Q.i>=QZ.length){const p=Math.round(Q.s/QZ.length*100);D.scores.push(p);log('Kuis selesai','Skor '+p+'%','quiz')}render()},
 addnote(){const t=$('#nt').value.trim(),b=$('#nb').value.trim();if(!t)return toast('Isi judul catatan dulu');D.notes.unshift({t,b});log('Catatan baru',t,'note');render();toast('Catatan disimpan')},
 addplan(){const t=$('#pt').value;if(!t)return toast('Pilih jam belajar dulu');D.plan.push({t,s:$('#ps').value,n:$('#pn').value.trim()});render();toast('Jadwal ditambahkan')},sstog(){SS.run=SS.run?0:1;$('#sbtn').textContent=SS.run?'Jeda':'Putar'},ssrst(){SS.t=0}};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a],[data-g],[data-f],[data-m],[data-o],[data-k],[data-d],[data-qs],[data-e],[data-pc]');if(!b)return;const d=b.dataset;
 if(d.e){PT.z=+d.e;ptUp()}else if(d.pc!==undefined){PT.c=PT.c==+d.pc?-1:+d.pc;ptUp()}else if(d.a)A[d.a]();else if(d.qs!==undefined)A.start(+d.qs);else if(d.g)go(d.g);
 else if(d.f!==undefined){F=+d.f+1;if(D.page!='materi'){D.page='materi'}M=null;render()}
 else if(d.m!==undefined){M=+d.m;if(!D.read.includes(M)){D.read.push(M);log('Materi dibaca',MAT[M][1],'book')}load();scrollTo(0,0)}
 else if(d.o!==undefined){if(Q.a!==null)return;Q.a=+d.o;if(Q.a==QZ[Q.i][3])Q.s++;render()}
 else if(d.d){const[k,i]=d.d.split(':');D[k].splice(+i,1);render()}
 else if(d.k){const k=d.k;if(k=='C')C={e:'',r:'0'};else if(k=='⌫')C.r=C.r.length>1?C.r.slice(0,-1):'0';else if(k=='='){try{const x=C.r.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/%/g,'/100');if(!/^[0-9+\-*/().\s]+$/.test(x))throw 0;const v=Function('"use strict";return('+x+')')();if(!isFinite(v))throw 0;C={e:C.r+' =',r:String(+v.toFixed(8))}}catch(_){toast('Ekspresi tidak valid')}}else C.r=(C.r=='0'&&!'.+−×÷%)'.includes(k)?'':C.r)+k;render()}});
document.addEventListener('input',e=>{if(e.target.id=='q'){V.q=e.target.value;const p=e.target.selectionStart;render();const i=$('#q');i.focus();i.setSelectionRange(p,p)}if(e.target.id=='nm'){D.name=e.target.value.trim()||'Siswa';shell();save()}});
document.addEventListener('keydown',e=>{if(e.key=='Escape')A.close()});
load();
</script>
</body>
</html>
